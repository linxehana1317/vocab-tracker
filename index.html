<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字學習平台 - v26.11.3</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>WB</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --muted: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左側邊欄 */
        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .logo-area { margin-bottom: 24px; }
        .logo-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .version-badge { font-size: 11px; background: #e0e7ff; color: #4338ca; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .sync-status { font-size: 12px; color: #059669; font-weight: 600; margin-top: 4px; display: block; }
        
        .nav-group { display: flex; flex-direction: column; gap: 6px; }
        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-item:hover { background: #f1f5f9; color: var(--text); }
        .nav-item.active { background: #eef2ff; color: var(--primary); font-weight: 600; border-color: #c7d2fe; }

        /* 右側主面板 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .search-box {
            display: flex;
            gap: 8px;
        }
        .search-input {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            outline: none;
            width: 220px;
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.15rem; font-weight: 600; margin-bottom: 16px; }

        /* 單字卡每行 4 個的動態網格 */
        .flashcard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        @media (max-width: 1200px) { .flashcard-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px) { .flashcard-grid { grid-template-columns: repeat(2, 1fr); } }

        .flashcard-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
        }
        .flashcard-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }
        .flashcard-word { font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .flashcard-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        .flashcard-def { font-size: 14px; color: #334155; line-height: 1.4; }

        /* 統計數據與日曆 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .stat-item { background: #f8fafc; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .stat-value { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: var(--muted); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .calendar-day-header { font-weight: 600; padding: 6px; color: var(--muted); font-size: 12px; }
        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
        }
        .calendar-day.has-data { background: #eef2ff; border-color: #c7d2fe; }
        .count-badge { font-weight: 700; color: var(--primary); font-size: 11px; }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        button:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }

        /* 彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 16px;
            width: 90%;
            max-width: 580px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .detail-section {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .detail-section h4 { margin: 0 0 8px; font-size: 0.85rem; color: var(--primary); text-transform: uppercase; }
    </style>
</head>
<body>

<!-- 左側選單 -->
<div class="sidebar">
    <div>
        <div class="logo-area">
            <div class="logo-title">
                單字庫平台
                <span class="version-badge">v26.11.1</span>
            </div>
            <span class="sync-status" id="syncStatus">雲端同步中</span>
        </div>

        <div style="font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; padding-left:4px;">單字級距分類</div>
        <div class="nav-group" id="levelNavGroup">
            <div class="nav-item active" onclick="switchLevel('1-1000', 'level1.json', this)">Level 1 (1-1000)</div>
            <div class="nav-item" onclick="switchLevel('1001-2000', 'level2.json', this)">Level 2 (1001-2000)</div>
            <div class="nav-item" onclick="switchLevel('2001-3000', 'level3.json', this)">Level 3 (2001-3000)</div>
            <div class="nav-item" onclick="switchLevel('3001-4000', 'level4.json', this)">Level 4 (3001-4000)</div>
            <div class="nav-item" onclick="switchLevel('4001-5000', 'level5.json', this)">Level 5 (4001-5000)</div>
            <div class="nav-item" onclick="switchLevel('5001-6000', 'level6.json', this)">Level 6 (5001-6000)</div>
            <div class="nav-item" onclick="switchLevel('6001-7000', 'level7.json', this)">Level 7 (6001-7000)</div>
        </div>
    </div>

    <button onclick="openAddWordModal()" style="width:100%;">+ 手動新增單字</button>
</div>

<!-- 右側主要區域 -->
<div class="main-content">
    <div class="header-bar">
        <h1 style="margin:0; font-size:1.4rem;" id="currentLevelTitle">Level 1 (1-1000)</h1>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋單字..." onkeypress="handleSearchKey(event)">
            <button onclick="searchWord()">搜尋</button>
        </div>
    </div>

    <!-- 單字卡排版區 -->
    <div class="card">
        <div class="flashcard-grid" id="flashcardGrid"></div>
    </div>

    <!-- 數據與日曆 -->
    <div class="dashboard-grid">
        <div class="card">
            <h2>學習統計</h2>
            <div class="stat-grid">
                <div class="stat-item"><div class="stat-value" id="statToday">0</div><div class="stat-label">今日</div></div>
                <div class="stat-item"><div class="stat-value" id="statWeek">0</div><div class="stat-label">本週</div></div>
                <div class="stat-item"><div class="stat-value" id="statMonth">0</div><div class="stat-label">本月</div></div>
                <div class="stat-item"><div class="stat-value" id="statYear">0</div><div class="stat-label">今年</div></div>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 id="calendarTitle" style="margin:0;">日曆打卡記錄</h2>
                <div>
                    <button onclick="changeMonth(-1)" class="btn-secondary">&lt;</button>
                    <button onclick="changeMonth(1)" class="btn-secondary">&gt;</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- 趨勢圖 -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h2 style="margin:0;">學習趨勢分析</h2>
            <div style="display:flex; gap:6px;">
                <button id="btn-week" onclick="switchChartRange('week')">週</button>
                <button id="btn-month" class="btn-secondary" onclick="switchChartRange('month')">月</button>
                <button id="btn-year" class="btn-secondary" onclick="switchChartRange('year')">年</button>
            </div>
        </div>
        <canvas id="trendChart" height="100"></canvas>
    </div>
</div>

<!-- 背面詳細資料視窗 -->
<div class="modal" id="cardDetailModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
            <div>
                <h3 id="modalWordTitle" style="margin:0; font-size:1.6rem;">word</h3>
                <div id="modalWordMeta" style="color:var(--muted); font-size:13px; margin-top:4px;">pos / kk</div>
            </div>
            <button onclick="closeCardModal()" class="btn-secondary">關閉</button>
        </div>

        <div style="font-size:1.05rem; font-weight:600; color:var(--primary); margin-bottom:16px;" id="modalWordDefinition">
            中文定義
        </div>

        <div class="detail-section">
            <h4>1. 衍伸單字與詞性變化</h4>
            <div id="modalDerivatives"></div>
        </div>

        <div class="detail-section">
            <h4>2. 核心字根與構詞延伸</h4>
            <div id="modalRoot"></div>
        </div>

        <div class="detail-section">
            <h4>3. 常用片語與例句</h4>
            <div id="modalPhrases"></div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
            <button onclick="speakCurrentWord()" class="btn-secondary">發音</button>
            <button id="modalStudiedBtn" onclick="toggleCardStudied()">標記為今日已背誦 (+1)</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD37inAxxk88gZzfnl1t3iiU4HnbwhW104",
        authDomain: "vocab-app-1c855.firebaseapp.com",
        databaseURL: "https://vocab-app-1c855-default-rtdb.firebaseio.com",
        projectId: "vocab-app-1c855",
        storageBucket: "vocab-app-1c855.firebasestorage.app",
        messagingSenderId: "642166474550",
        appId: "1:642166474550:web:c397de3f1d8f0826d29597"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const vocabRef = db.ref('vocabData');

    let currentLevelData = [];
    let vocabData = {};
    let currentDate = new Date(2026, 10, 1);
    let chartInstance = null;
    let activeCardData = null;

    async function fetchLevelData(jsonFileName) {
        try {
            const res = await fetch(jsonFileName + '?v=' + new Date().getTime());
            if (!res.ok) throw new Error('讀取失敗');
            currentLevelData = await res.json();
            renderCards();
        } catch (err) {
            console.error(err);
            document.getElementById('flashcardGrid').innerHTML = `<div style="color:var(--muted); padding:20px;">無法讀取 ${jsonFileName}，請確認檔案是否存在。</div>`;
        }
    }

    function switchLevel(title, fileName, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('currentLevelTitle').innerText = `Level ${title}`;
        fetchLevelData(fileName);
    }

    function renderCards() {
        const grid = document.getElementById('flashcardGrid');
        grid.innerHTML = '';
        if (currentLevelData.length === 0) {
            grid.innerHTML = '<div style="color:var(--muted); padding:20px;">此分類目前無單字。</div>';
            return;
        }

        currentLevelData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flashcard-item';
            card.onclick = () => openCardDetail(item);
            card.innerHTML = `
                <div>
                    <div class="flashcard-word">${item.word}</div>
                    <div class="flashcard-meta">${item.pos} | ${item.kk}</div>
                    <div class="flashcard-def">${item.definition}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openCardDetail(item) {
        activeCardData = item;
        document.getElementById('modalWordTitle').innerText = item.word;
        document.getElementById('modalWordMeta').innerText = `${item.pos} | ${item.kk}`;
        document.getElementById('modalWordDefinition').innerText = item.definition;

        const derivArea = document.getElementById('modalDerivatives');
        derivArea.innerHTML = '';
        if(item.derivatives && item.derivatives.length > 0) {
            item.derivatives.forEach(d => {
                derivArea.innerHTML += `<div><strong>${d.word}</strong> (${d.pos}): ${d.meaning}</div>`;
            });
        } else derivArea.innerText = '無';

        document.getElementById('modalRoot').innerText = item.root || '無';

        const phraseArea = document.getElementById('modalPhrases');
        phraseArea.innerHTML = '';
        if(item.phrases && item.phrases.length > 0) {
            item.phrases.forEach(p => {
                phraseArea.innerHTML += `<div><strong>${p.phrase}</strong> (${p.meaning})<br><span style="color:var(--primary);">${p.sentence}</span></div>`;
            });
        } else phraseArea.innerText = '無';

        document.getElementById('cardDetailModal').style.display = 'flex';
    }

    function closeCardModal() { document.getElementById('cardDetailModal').style.display = 'none'; }

    function speakCurrentWord() {
        if(activeCardData && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(activeCardData.word);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }
    }

    function init() {
        fetchLevelData('level1.json');
        initChart();
        vocabRef.on('value', snap => {
            vocabData = snap.val() || {};
            renderCalendar();
            updateStats();
            updateChart();
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const y = currentDate.getFullYear(), m = currentDate.getMonth();
        document.getElementById('calendarTitle').innerText = `${y}年 ${m + 1}月`;

        ['日','一','二','三','四','五','六'].forEach(w => {
            grid.innerHTML += `<div class="calendar-day-header">${w}</div>`;
        });

        const firstDay = new Date(y, m, 1).getDay();
        const days = new Date(y, m + 1, 0).getDate();

        for(let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

        for(let d = 1; d <= days; d++) {
            const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const val = vocabData[dateStr];
            grid.innerHTML += `
                <div class="calendar-day ${val ? 'has-data' : ''}">
                    <span>${d}</span>
                    ${val ? `<div class="count-badge">+${val}</div>` : ''}
                </div>
            `;
        }
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    function updateStats() {
        document.getElementById('statToday').innerText = vocabData['2026-11-01'] || 0;
    }

    function initChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['10/26','10/27','10/28','10/29','10/30','10/31','11/01'], datasets: [{ data: [0,0,0,0,0,0,0], backgroundColor: '#4f46e5' }] },
            options: { plugins: { legend: { display: false } } }
        });
    }
    function updateChart() {}
    function switchChartRange() {}

    window.onload = init;
</script>
</body>
</html>
