<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字學習平台 - v26.11.4</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>WB</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --muted: #64748b;
            --studied-bg: #eef2ff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左側邊欄 */
        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .logo-area { margin-bottom: 24px; }
        .logo-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .version-badge { font-size: 11px; background: #e0e7ff; color: #4338ca; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .sync-status { font-size: 12px; color: #059669; font-weight: 600; margin-top: 4px; display: block; }
        
        .nav-group { display: flex; flex-direction: column; gap: 6px; }
        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-item:hover { background: #f1f5f9; color: var(--text); }
        .nav-item.active { background: #eef2ff; color: var(--primary); font-weight: 600; border-color: #c7d2fe; }

        /* 右側主面板 (外側捲動) */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .search-box { display: flex; gap: 8px; }
        .search-input {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            outline: none;
            width: 220px;
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.15rem; font-weight: 600; margin-bottom: 16px; }

        /* 單字卡專屬 4*4 檢視容器 (內部捲動) */
        .flashcard-scroll-container {
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .flashcard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        @media (max-width: 1400px) { .flashcard-grid { grid-template-columns: repeat(3, 1fr); } }

        .flashcard-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
            position: relative;
            overflow: hidden;
        }
        .flashcard-item.is-studied {
            background-color: var(--studied-bg);
            border-color: #c7d2fe;
        }
        /* 答對超過 4 次的反光特效 */
        .flashcard-item.mastered::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255,255,255,0.6) 50%, transparent 70%);
            transform: rotate(30deg);
            animation: shine 3s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .flashcard-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }
        .flashcard-word { font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .flashcard-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        .flashcard-def { font-size: 14px; color: #334155; line-height: 1.4; }

        /* 統計與日曆並排區塊 */
        .dashboard-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .stat-trend-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .stat-item { background: #f8fafc; padding: 14px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: var(--muted); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .calendar-day-header { font-weight: 600; padding: 6px; color: var(--muted); font-size: 12px; }
        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
        }
        .calendar-day.has-data { background: #eef2ff; border-color: #c7d2fe; }
        .count-badge { font-weight: 700; color: var(--primary); font-size: 11px; }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        button:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }

        /* 通用彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 16px;
            width: 90%;
            max-width: 580px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none;
        }
        .detail-section {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .detail-section h4 { margin: 0 0 8px; font-size: 0.85rem; color: var(--primary); text-transform: uppercase; }
    </style>
</head>
<body>

<!-- 左側選單 -->
<div class="sidebar">
    <div>
        <div class="logo-area">
            <div class="logo-title">
                單字庫平台
                <span class="version-badge">v26.11.4</span>
            </div>
            <span class="sync-status" id="syncStatus">雲端同步中</span>
        </div>

        <div style="font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; padding-left:4px;">單字級距分類</div>
        <div class="nav-group" id="levelNavGroup">
            <div class="nav-item active" onclick="switchLevel('1-1000', 'level1.json', this)">Level 1 (1-1000)</div>
            <div class="nav-item" onclick="switchLevel('1001-2000', 'level2.json', this)">Level 2 (1001-2000)</div>
            <div class="nav-item" onclick="switchLevel('2001-3000', 'level3.json', this)">Level 3 (2001-3000)</div>
            <div class="nav-item" onclick="switchLevel('3001-4000', 'level4.json', this)">Level 4 (3001-4000)</div>
            <div class="nav-item" onclick="switchLevel('4001-5000', 'level5.json', this)">Level 5 (4001-5000)</div>
            <div class="nav-item" onclick="switchLevel('5001-6000', 'level6.json', this)">Level 6 (5001-6000)</div>
            <div class="nav-item" onclick="switchLevel('6001-7000', 'level7.json', this)">Level 7 (6001-7000)</div>
        </div>
    </div>

    <button onclick="openAddWordModal()" style="width:100%;">+ 手動新增單字</button>
</div>

<!-- 右側主要區域 -->
<div class="main-content">
    <div class="header-bar">
        <h1 style="margin:0; font-size:1.4rem;" id="currentLevelTitle">Level 1 (1-1000)</h1>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋單字..." oninput="searchWord()">
            <button onclick="searchWord()">搜尋</button>
        </div>
    </div>

    <!-- 單字卡固定高度滾動框 (約 4*4 顯示區) -->
    <div class="card">
        <div class="flashcard-scroll-container">
            <div class="flashcard-grid" id="flashcardGrid"></div>
        </div>
    </div>

    <!-- 統計、趨勢與日曆同排配置 -->
    <div class="dashboard-row">
        <!-- 左側：學習統計 + 趨勢分析 -->
        <div class="stat-trend-wrapper">
            <div class="card" style="margin-bottom:0;">
                <h2>學習統計</h2>
                <div class="stat-grid">
                    <div class="stat-item"><div class="stat-value" id="statToday">0</div><div class="stat-label">今日</div></div>
                    <div class="stat-item"><div class="stat-value" id="statWeek">0</div><div class="stat-label">本週</div></div>
                    <div class="stat-item"><div class="stat-value" id="statMonth">0</div><div class="stat-label">本月</div></div>
                    <div class="stat-item"><div class="stat-value" id="statYear">0</div><div class="stat-label">今年</div></div>
                </div>
            </div>

            <div class="card" style="margin-bottom:0;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h2 style="margin:0;">學習趨勢分析</h2>
                </div>
                <canvas id="trendChart" height="110"></canvas>
            </div>
        </div>

        <!-- 右側：日曆打卡 -->
        <div class="card" style="margin-bottom:0; height:fit-content;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 id="calendarTitle" style="margin:0;">日曆打卡記錄</h2>
                <div>
                    <button onclick="changeMonth(-1)" class="btn-secondary">&lt;</button>
                    <button onclick="changeMonth(1)" class="btn-secondary">&gt;</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>
</div>

<!-- 單字詳細資料彈窗 -->
<div class="modal" id="cardDetailModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
            <div>
                <h3 id="modalWordTitle" style="margin:0; font-size:1.6rem;">word</h3>
                <div id="modalWordMeta" style="color:var(--muted); font-size:13px; margin-top:4px;">pos / kk</div>
            </div>
            <button onclick="closeCardModal()" class="btn-secondary">關閉</button>
        </div>

        <div style="font-size:1.05rem; font-weight:600; color:var(--primary); margin-bottom:16px;" id="modalWordDefinition"></div>

        <div class="detail-section">
            <h4>1. 衍伸單字與詞性變化</h4>
            <div id="modalDerivatives"></div>
        </div>

        <div class="detail-section">
            <h4>2. 核心字根與構詞延伸</h4>
            <div id="modalRoot"></div>
        </div>

        <div class="detail-section">
            <h4>3. 常用片語與例句</h4>
            <div id="modalPhrases"></div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
            <button onclick="speakCurrentWord()" class="btn-secondary">發音</button>
            <button id="modalStudiedBtn" onclick="toggleCardStudied()">標記為今日已背誦 (+1)</button>
        </div>
    </div>
</div>

<!-- 手動新增單字彈窗 -->
<div class="modal" id="addWordModal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--primary);">手動新增單字</h3>
        <div class="form-group">
            <label>英文單字 (Word)</label>
            <input type="text" id="newWord" placeholder="例如: banana">
        </div>
        <div class="form-group">
            <label>詞性 (POS)</label>
            <input type="text" id="newPos" placeholder="例如: n.">
        </div>
        <div class="form-group">
            <label>KK音標 (KK)</label>
            <input type="text" id="newKk" placeholder="例如: /bəˈnænə/">
        </div>
        <div class="form-group">
            <label>中文定義 (Definition)</label>
            <input type="text" id="newDef" placeholder="例如: 香蕉">
        </div>
        <div class="form-group">
            <label>字根/字源 (Root)</label>
            <input type="text" id="newRoot" placeholder="例如: 源自西非語言...">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
            <button onclick="closeAddWordModal()" class="btn-secondary">取消</button>
            <button onclick="saveNewWord()">確認新增</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD37inAxxk88gZzfnl1t3iiU4HnbwhW104",
        authDomain: "vocab-app-1c855.firebaseapp.com",
        databaseURL: "https://vocab-app-1c855-default-rtdb.firebaseio.com",
        projectId: "vocab-app-1c855",
        storageBucket: "vocab-app-1c855.firebasestorage.app",
        messagingSenderId: "642166474550",
        appId: "1:642166474550:web:c397de3f1d8f0826d29597"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const vocabRef = db.ref('vocabData');
    const studiedRef = db.ref('studiedWords');
    const statsRef = db.ref('testStats'); // 用於記錄測試答對次數

    let currentLevelData = [];
    let currentFileName = 'level1.json';
    let vocabData = {};
    let studiedWords = {};
    let testStats = {};
    let currentDate = new Date(2026, 10, 1);
    let chartInstance = null;
    let activeCardData = null;

    async function fetchLevelData(jsonFileName) {
        currentFileName = jsonFileName;
        try {
            const res = await fetch(jsonFileName + '?v=' + new Date().getTime());
            if (!res.ok) throw new Error('讀取失敗');
            currentLevelData = await res.json();
            renderCards(currentLevelData);
        } catch (err) {
            console.error(err);
            document.getElementById('flashcardGrid').innerHTML = `<div style="color:var(--muted); padding:20px;">無法讀取 ${jsonFileName}。</div>`;
        }
    }

    function switchLevel(title, fileName, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('currentLevelTitle').innerText = `Level ${title}`;
        fetchLevelData(fileName);
    }

    function renderCards(dataList) {
        const grid = document.getElementById('flashcardGrid');
        grid.innerHTML = '';
        if (!Array.isArray(dataList) || dataList.length === 0) {
            grid.innerHTML = '<div style="color:var(--muted); padding:20px;">此分類目前無單字。</div>';
            return;
        }

        dataList.forEach(item => {
            const isStudied = studiedWords[item.word] === true;
            const correctCount = testStats[item.word] || 0;
            const isMastered = correctCount >= 4;

            const card = document.createElement('div');
            card.className = `flashcard-item ${isStudied ? 'is-studied' : ''} ${isMastered ? 'mastered' : ''}`;
            card.onclick = () => openCardDetail(item);
            card.innerHTML = `
                <div>
                    <div class="flashcard-word">${item.word}</div>
                    <div class="flashcard-meta">${item.pos} | ${item.kk}</div>
                    <div class="flashcard-def">${item.definition}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function searchWord() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!keyword) {
            renderCards(currentLevelData);
            return;
        }
        const filtered = currentLevelData.filter(item => 
            item.word.toLowerCase().includes(keyword) || 
            item.definition.includes(keyword)
        );
        renderCards(filtered);
    }

    function openCardDetail(item) {
        activeCardData = item;
        document.getElementById('modalWordTitle').innerText = item.word;
        document.getElementById('modalWordMeta').innerText = `${item.pos} | ${item.kk}`;
        document.getElementById('modalWordDefinition').innerText = item.definition;

        const derivArea = document.getElementById('modalDerivatives');
        derivArea.innerHTML = '';
        if(item.derivatives && item.derivatives.length > 0) {
            item.derivatives.forEach(d => {
                derivArea.innerHTML += `<div><strong>${d.word}</strong> (${d.pos}): ${d.meaning}</div>`;
            });
        } else derivArea.innerText = '無';

        document.getElementById('modalRoot').innerText = item.root || '無';

        const phraseArea = document.getElementById('modalPhrases');
        phraseArea.innerHTML = '';
        if(item.phrases && item.phrases.length > 0) {
            item.phrases.forEach(p => {
                phraseArea.innerHTML += `<div><strong>${p.phrase}</strong> (${p.meaning})<br><span style="color:var(--primary);">${p.sentence}</span></div>`;
            });
        } else phraseArea.innerText = '無';

        const isStudied = studiedWords[item.word];
        const btn = document.getElementById('modalStudiedBtn');
        btn.innerText = isStudied ? '已標記為背誦 (取消)' : '標記為今日已背誦 (+1)';

        document.getElementById('cardDetailModal').style.display = 'flex';
    }

    function closeCardModal() { document.getElementById('cardDetailModal').style.display = 'none'; }

    function toggleCardStudied() {
        if (!activeCardData) return;
        const word = activeCardData.word;
        const todayStr = '2026-11-01'; // 依照目前模擬系統日期

        const currentStatus = !!studiedWords[word];
        const newStatus = !currentStatus;

        // 更新雲端已背誦清單
        studiedRef.child(word).set(newStatus);

        // 同步更新當日打卡計數
        let currentCount = vocabData[todayStr] || 0;
        if (newStatus) {
            currentCount++;
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        } else {
            currentCount = Math.max(0, currentCount - 1);
        }
        vocabRef.child(todayStr).set(currentCount);

        closeCardModal();
    }

    function openAddWordModal() { document.getElementById('addWordModal').style.display = 'flex'; }
    function closeAddWordModal() { document.getElementById('addWordModal').style.display = 'none'; }

    function saveNewWord() {
        const word = document.getElementById('newWord').value.trim();
        const pos = document.getElementById('newPos').value.trim();
        const kk = document.getElementById('newKk').value.trim();
        const definition = document.getElementById('newDef').value.trim();
        const root = document.getElementById('newRoot').value.trim();

        if (!word || !definition) {
            alert('請至少填寫單字與中文定義！');
            return;
        }

        const newObj = { word, pos, kk, definition, root, derivatives: [], phrases: [] };
        currentLevelData.push(newObj);
        renderCards(currentLevelData);
        closeAddWordModal();
        alert(`已成功新增 "${word}" 至當前清單！(記得將此 JSON 備份更新至 ${currentFileName})`);
    }

    function speakCurrentWord() {
        if(activeCardData && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(activeCardData.word);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }
    }

    function init() {
        fetchLevelData('level1.json');
        initChart();

        // 監聽 Firebase 資料同步
        vocabRef.on('value', snap => {
            vocabData = snap.val() || {};
            renderCalendar();
            updateStats();
            updateChart();
        });

        studiedRef.on('value', snap => {
            studiedWords = snap.val() || {};
            renderCards(currentLevelData);
        });

        statsRef.on('value', snap => {
            testStats = snap.val() || {};
            renderCards(currentLevelData);
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const y = currentDate.getFullYear(), m = currentDate.getMonth();
        document.getElementById('calendarTitle').innerText = `${y}年 ${m + 1}月`;

        ['日','一','二','三','四','五','六'].forEach(w => {
            grid.innerHTML += `<div class="calendar-day-header">${w}</div>`;
        });

        const firstDay = new Date(y, m, 1).getDay();
        const days = new Date(y, m + 1, 0).getDate();

        for(let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

        for(let d = 1; d <= days; d++) {
            const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const val = vocabData[dateStr];
            grid.innerHTML += `
                <div class="calendar-day ${val ? 'has-data' : ''}">
                    <span>${d}</span>
                    ${val ? `<div class="count-badge">+${val}</div>` : ''}
                </div>
            `;
        }
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

function updateStats() {
    let todayStr = '2026-11-01';
    let todayCount = vocabData[todayStr] || 0;
    let weekCount = 0;
    let monthCount = 0;
    let yearCount = 0;

    for (const [dateStr, val] of Object.entries(vocabData)) {
        if (typeof val === 'number') {
            // 計算今年 (以 2026 為例)
            if (dateStr.startsWith('2026')) {
                yearCount += val;
            }
            // 計算本月 (以 2026-11 為例)
            if (dateStr.startsWith('2026-11')) {
                monthCount += val;
            }
            // 計算本週或當日
            if (dateStr === todayStr) {
                weekCount += val; // 可根據需要擴充本週跨天邏輯
            }
        }
    }

    document.getElementById('statToday').innerText = todayCount;
    document.getElementById('statWeek').innerText = weekCount;
    document.getElementById('statMonth').innerText = monthCount;
    document.getElementById('statYear').innerText = yearCount;
}

    function initChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: ['10/26','10/27','10/28','10/29','10/30','10/31','11/01'], 
                datasets: [{ data: [0,0,0,0,0,0,3], backgroundColor: '#4f46e5' }] 
            },
            options: { 
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
    }

    function updateChart() {
        if (!chartInstance) return;
        const todayStr = '2026-11-01';
        const val = vocabData[todayStr] || 0;
        chartInstance.data.datasets[0].data = [0, 0, 0, 0, 0, 0, val];
        chartInstance.update();
    }

    window.onload = init;
</script>
</body>
</html>
