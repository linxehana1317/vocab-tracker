<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字學習平台 - v26.11.8</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 x=%22.1em%22 font-size=%2290%22 font-weight=%22bold%22>W</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --muted: #64748b;
            --studied-bg: #eef2ff;
            --wrong-bg: #fee2e2;
            --wrong-border: #fca5a5;
            --mastered-bg: #dcfce7;
            --mastered-border: #86efac;
            --starred-bg: #fef9c3;
            --starred-border: #fde047;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .logo-area { margin-bottom: 20px; }
        .logo-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .version-badge { font-size: 11px; background: #e0e7ff; color: #4338ca; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .sync-status { font-size: 12px; color: #059669; font-weight: 600; margin-top: 4px; display: block; }
        
        .nav-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-item:hover { background: #f1f5f9; color: var(--text); }
        .nav-item.active { background: #eef2ff; color: var(--primary); font-weight: 600; border-color: #c7d2fe; }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .search-box { display: flex; gap: 8px; align-items: center; }
        .search-input {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            outline: none;
            width: 200px;
            font-size: 14px;
        }
        .filter-select {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            outline: none;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            color: var(--text);
            font-weight: 500;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.15rem; font-weight: 600; margin-bottom: 16px; }

        .flashcard-scroll-container {
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .flashcard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        @media (max-width: 1400px) { .flashcard-grid { grid-template-columns: repeat(3, 1fr); } }

        .flashcard-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
            position: relative;
            overflow: hidden;
        }
        .flashcard-item.is-studied { background-color: var(--studied-bg); border-color: #c7d2fe; }
        .flashcard-item.is-mastered { border-left: 5px solid #16a34a; }
        .flashcard-item.is-wrong { border-left: 5px solid #dc2626; }
        .flashcard-item.is-starred { border-left: 5px solid #eab308; }

        .flashcard-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }
        .flashcard-word { font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .flashcard-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        .flashcard-def { font-size: 14px; color: #334155; line-height: 1.4; }

        .dashboard-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .stat-trend-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat-item { background: #f8fafc; padding: 12px 8px; border-radius: 8px; text-align: center; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
        .stat-item:hover { border-color: var(--primary); background: #f1f5f9; transform: translateY(-1px); }
        .stat-value { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .calendar-day-header { font-weight: 600; padding: 6px; color: var(--muted); font-size: 12px; }
        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            cursor: pointer;
        }
        .calendar-day.has-data { background: #eef2ff; border-color: #c7d2fe; }
        .count-badge { font-weight: 700; color: var(--primary); font-size: 11px; }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        button:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 4px 8px; font-size: 11px; border-radius: 4px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        #cardDetailModal { z-index: 1100; }

        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 16px;
            width: 90%;
            max-width: 580px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
        .form-group input, .form-group select {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none;
        }
        .detail-section {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .detail-section h4 { margin: 0 0 8px; font-size: 0.85rem; color: var(--primary); text-transform: uppercase; }

        .date-input-compact {
            width: 110px !important;
            padding: 6px 10px !important;
            font-size: 13px !important;
            border-radius: 8px !important;
            border: 1px solid var(--border) !important;
            text-align: center;
            font-weight: 600;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div>
        <div class="logo-area">
            <div class="logo-title">
                單字庫平台
                <span class="version-badge">v26.11.8</span>
            </div>
            <span class="sync-status" id="syncStatus">雲端同步中</span>
        </div>

        <div style="font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; padding-left:4px;">單字級距分類</div>
        <div class="nav-group" id="levelNavGroup">
            <div class="nav-item active" onclick="switchLevel('Level 1', 'level1.json', this)">Level 1</div>
            <div class="nav-item" onclick="switchLevel('Level 2', 'level2.json', this)">Level 2</div>
            <div class="nav-item" onclick="switchLevel('Level 3', 'level3.json', this)">Level 3</div>
            <div class="nav-item" onclick="switchLevel('Level 4', 'level4.json', this)">Level 4</div>
            <div class="nav-item" onclick="switchLevel('Level 5', 'level5.json', this)">Level 5</div>
            <div class="nav-item" onclick="switchLevel('Level 6', 'level6.json', this)">Level 6</div>
            <div class="nav-item" onclick="switchLevel('Level 7', 'level7.json', this)">Level 7</div>
        </div>

        <div style="font-size:12px; font-weight:600; color:var(--muted); margin:16px 0 8px 4px;">測驗區塊</div>
        <div class="nav-group">
            <div class="nav-item" id="testNavItem" onclick="openTestView(this)">字彙測驗系統</div>
        </div>
    </div>

    <button onclick="openAddWordModal()" style="width:100%;">+ 手動新增單字</button>
</div>

<div class="main-content">
    
    <div id="vocabView">
        <div class="header-bar">
            <div style="display: flex; align-items: center; gap: 16px;">
                <h1 style="margin:0; font-size:1.4rem;" id="currentLevelTitle">Level 1</h1>
                
                <select id="subLevelSelect" onchange="filterSubLevel()" style="padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; outline: none; background: #fff;">
                    <option value="all">全部單字 (1-1000)</option>
                    <option value="0">第 1 - 100 字</option>
                    <option value="1">第 101 - 200 字</option>
                    <option value="2">第 201 - 300 字</option>
                    <option value="3">第 301 - 400 字</option>
                    <option value="4">第 401 - 500 字</option>
                    <option value="5">第 501 - 600 字</option>
                    <option value="6">第 601 - 700 字</option>
                    <option value="7">第 701 - 800 字</option>
                    <option value="8">第 801 - 900 字</option>
                    <option value="9">第 901 - 1000 字</option>
                </select>
            </div>

            <div class="search-box">
                <!-- 單字狀態篩選選單 -->
                <select id="statusFilterSelect" class="filter-select" onchange="filterSubLevel()">
                    <option value="all">全部單字</option>
                    <option value="studied">已背誦</option>
                    <option value="unstudied">未背誦</option>
                    <option value="mastered">精熟單字</option>
                    <option value="wrong">錯誤單字</option>
                    <option value="starred">標記單字</option>
                </select>

                <input type="text" id="searchInput" class="search-input" placeholder="搜尋單字..." oninput="searchWord()">
                <button onclick="searchWord()">搜尋</button>
            </div>
        </div>

        <div class="card">
            <div class="flashcard-scroll-container">
                <div class="flashcard-grid" id="flashcardGrid"></div>
            </div>
        </div>

        <div class="dashboard-row">
            <div class="stat-trend-wrapper">
                <div class="card" style="margin-bottom:0;">
                    <h2>學習統計與字庫概況</h2>
                    <div class="stat-grid">
                        <div class="stat-item"><div class="stat-value" id="statToday">0</div><div class="stat-label">今日背誦</div></div>
                        <div class="stat-item"><div class="stat-value" id="statMonth">0</div><div class="stat-label">本月背誦</div></div>
                        <div class="stat-item"><div class="stat-value" id="statYear">0</div><div class="stat-label">今年背誦</div></div>
                        
                        <div class="stat-item" style="background:#f0fdf4; border-color:#bbf7d0;" onclick="openLibraryModal('mastered')"><div class="stat-value" style="color:#16a34a;" id="statMastered">0</div><div class="stat-label">精熟單字</div></div>
                        <div class="stat-item" style="background:#fef2f2; border-color:#fecaca;" onclick="openLibraryModal('wrong')"><div class="stat-value" style="color:#dc2626;" id="statWrong">0</div><div class="stat-label">錯誤單字</div></div>
                        <div class="stat-item" style="background:#fefce8; border-color:#fef08a;" onclick="openLibraryModal('starred')"><div class="stat-value" style="color:#ca8a04;" id="statStarred">0</div><div class="stat-label">標記單字</div></div>
                    </div>
                </div>

                <div class="card" style="margin-bottom:0;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                        <h2 style="margin:0;">學習趨勢分析</h2>
                        <div style="display:flex; gap:6px;">
                            <button id="btn-week" onclick="switchChartRange('week')">週</button>
                            <button id="btn-month" class="btn-secondary" onclick="switchChartRange('month')">月</button>
                            <button id="btn-year" class="btn-secondary" onclick="switchChartRange('year')">年</button>
                        </div>
                    </div>
                    <canvas id="trendChart" height="110"></canvas>
                </div>
            </div>

            <div class="card" style="margin-bottom:0; height:fit-content;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h2 id="calendarTitle" style="margin:0;">日曆打卡記錄</h2>
                    <div>
                        <button onclick="changeMonth(-1)" class="btn-secondary">&lt;</button>
                        <button onclick="changeMonth(1)" class="btn-secondary">&gt;</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </div>
    </div>

    <div id="testView" style="display:none;">
        <div class="header-bar">
            <h1 style="margin:0; font-size:1.4rem;">字彙測驗系統</h1>
        </div>
        <div class="card">
            <h2>測驗設定</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>題型選擇</label>
                    <select id="testType">
                        <option value="choice">選擇題 (英翻中)</option>
                        <option value="fill">填空題 (拼寫測試)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>題數設定</label>
                    <select id="testCount">
                        <option value="5">5題</option>
                        <option value="10" selected>10題</option>
                        <option value="20">20題</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>範圍來源</label>
                    <select id="testSource" onchange="toggleTestSource()">
                        <option value="level">依照目前等級範圍/次分類</option>
                        <option value="date">依照指定打卡日期範圍 (YYYYMMDD)</option>
                    </select>
                </div>
                <div class="form-group" id="dateRangeGroup" style="display:none;">
                    <label>指定日期範圍 (格式: YYYYMMDD)</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="text" id="testStartDateInput" placeholder="開始日期 (例: 20261101)" maxlength="8">
                        <span>至</span>
                        <input type="text" id="testEndDateInput" placeholder="結束日期 (例: 20261107)" maxlength="8">
                    </div>
                </div>
            </div>
            <button onclick="startTest()" style="margin-top: 16px;">開始測驗</button>
        </div>

        <div class="card" id="testCardArea" style="display:none;">
            <div id="testContainer"></div>
        </div>
    </div>

</div>

<!-- 單字詳細彈窗 -->
<div class="modal" id="cardDetailModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
            <div style="display:flex; align-items:center; gap:12px;">
                <button id="modalStarBtn" onclick="toggleStarStatus()" style="background:none; border:none; font-size:1.8rem; cursor:pointer; padding:0; line-height:1;" title="標記單字">⭐</button>
                <div>
                    <h3 id="modalWordTitle" style="margin:0; font-size:1.6rem;">word</h3>
                    <div id="modalWordMeta" style="color:var(--muted); font-size:13px; margin-top:4px;">pos / kk</div>
                </div>
            </div>
            <button onclick="closeCardModal()" class="btn-secondary">關閉</button>
        </div>

        <div style="font-size:1.05rem; font-weight:600; color:var(--primary); margin-bottom:16px;" id="modalWordDefinition"></div>

        <div class="detail-section">
            <h4>1. 衍伸單字與詞性變化</h4>
            <div id="modalDerivatives"></div>
        </div>

        <div class="detail-section">
            <h4>2. 核心字根與構詞延伸</h4>
            <div id="modalRoot"></div>
        </div>

        <div class="detail-section">
            <h4>3. 常用片語與例句</h4>
            <div id="modalPhrases"></div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; flex-wrap:wrap; gap:10px;">
            <button id="modalWrongBtn" onclick="toggleWrongStatus()" class="btn-danger" style="display:none;">從錯誤單字移除</button>

            <div style="display:flex; gap:8px; align-items:center; margin-left:auto;">
                <button onclick="speakCurrentWord()" class="btn-secondary">發音</button>
                <input type="text" id="cardCustomDate" class="date-input-compact" placeholder="YYYYMMDD" maxlength="8">
                <button id="modalStudiedBtn" onclick="toggleCardStudied()">標記為背誦</button>
            </div>
        </div>
    </div>
</div>

<!-- 日曆與專屬字庫彈窗共用 -->
<div class="modal" id="dayDetailModal">
    <div class="modal-content">
        <h3 id="dayDetailTitle" style="margin-top:0; color:var(--primary);">打卡記錄</h3>
        <div id="dayDetailList" style="max-height: 380px; overflow-y: auto; margin-bottom: 20px; padding-right: 4px;"></div>
        <div style="display:flex; justify-content:space-between; align-items:center;" id="dayDetailFooter">
            <button onclick="clearSelectedDayRecord()" class="btn-danger" id="clearDayBtn">清空全日標記</button>
            <div style="display:flex; gap:8px;">
                <button onclick="startDayTestFromModal()" class="btn-secondary" id="testDayBtn">測驗當日單字</button>
                <button onclick="closeDayModal()" class="btn-secondary">關閉</button>
            </div>
        </div>
    </div>
</div>

<!-- 手動新增單字彈窗 -->
<div class="modal" id="addWordModal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--primary);">手動新增單字</h3>
        <div class="form-group">
            <label>英文單字 (Word)</label>
            <input type="text" id="newWord" placeholder="例如: banana">
        </div>
        <div class="form-group">
            <label>詞性 (POS)</label>
            <input type="text" id="newPos" placeholder="例如: n.">
        </div>
        <div class="form-group">
            <label>KK音標 (KK)</label>
            <input type="text" id="newKk" placeholder="例如: /bəˈnænə/">
        </div>
        <div class="form-group">
            <label>中文定義 (Definition)</label>
            <input type="text" id="newDef" placeholder="例如: 香蕉">
        </div>
        <div class="form-group">
            <label>字根/字源 (Root)</label>
            <input type="text" id="newRoot" placeholder="例如: 源自西非語言...">
        </div>
        <div class="form-group">
            <label>衍伸單字 (格式: 單字|詞性|意思，多個用逗號隔開)</label>
            <input type="text" id="newDerivatives" placeholder="例如: dangerously|adv.|危險地">
        </div>
        <div class="form-group">
            <label>常用片語與例句 (格式: 片語|意思|例句)</label>
            <input type="text" id="newPhrases" placeholder="例如: in danger|處於危險中|He is in danger.">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
            <button onclick="closeAddWordModal()" class="btn-secondary">取消</button>
            <button onclick="saveNewWord()">確認新增</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD37inAxxk88gZzfnl1t3iiU4HnbwhW104",
        authDomain: "vocab-app-1c855.firebaseapp.com",
        databaseURL: "https://vocab-app-1c855-default-rtdb.firebaseio.com",
        projectId: "vocab-app-1c855",
        storageBucket: "vocab-app-1c855.firebasestorage.app",
        messagingSenderId: "642166474550",
        appId: "1:642166474550:web:c397de3f1d8f0826d29597"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const vocabRef = db.ref('vocabData');
    const studiedRef = db.ref('studiedWords');
    const statsRef = db.ref('testStats');
    const dayWordsRef = db.ref('dayWords');
    const wrongRef = db.ref('wrongWords');
    const starredRef = db.ref('starredWords');

    let currentLevelData = [];
    let currentFileName = 'level1.json';
    let vocabData = {};
    let studiedWords = {};
    let testStats = {};
    let dayWordsData = {};
    let wrongWords = {};
    let starredWords = {};
    let currentDate = new Date();
    let activeSelectedDate = '';
    let chartInstance = null;
    let activeCardData = null;
    let currentChartRange = 'week';
    let currentTestQuestions = [];

    function getTodayYYYYMMDD() {
        const d = new Date();
        return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatYYYYMMDDToStandard(str) {
        if (!str || str.length !== 8) return str;
        return `${str.substring(0,4)}-${str.substring(4,6)}-${str.substring(6,8)}`;
    }

    async function checkAndInitDatabase() {
        const nodesToEnsure = ['vocabData', 'studiedWords', 'testStats', 'dayWords', 'wrongWords', 'starredWords'];
        for (const nodeName of nodesToEnsure) {
            const snapshot = await db.ref(nodeName).once('value');
            if (!snapshot.exists()) {
                await db.ref(nodeName).set({});
            }
        }
    }

    async function fetchLevelData(jsonFileName) {
        currentFileName = jsonFileName;
        try {
            const res = await fetch(jsonFileName + '?v=' + new Date().getTime());
            if (!res.ok) throw new Error('讀取失敗');
            let serverData = await res.json();
            
            let customKey = 'custom_' + jsonFileName;
            let localCustom = JSON.parse(localStorage.getItem(customKey) || '[]');
            
            let combined = [...serverData, ...localCustom];
            
            // 加上 Map 去重防重複機制
            const uniqueMap = new Map();
            combined.forEach(item => {
                if (item && item.word) {
                    uniqueMap.set(item.word.toLowerCase(), item);
                }
            });
            currentLevelData = Array.from(uniqueMap.values());

            filterSubLevel();
        } catch (err) {
            console.error(err);
            document.getElementById('flashcardGrid').innerHTML = `<div style="color:var(--muted); padding:20px;">無法讀取 ${jsonFileName}。</div>`;
        }
    }

    function switchLevel(title, fileName, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');

        document.getElementById('vocabView').style.display = 'block';
        document.getElementById('testView').style.display = 'none';

        document.getElementById('currentLevelTitle').innerText = title;
        document.getElementById('subLevelSelect').value = 'all';
        fetchLevelData(fileName);
    }

    // 結合級距、搜尋框與狀態篩選條件
    function filterSubLevel() {
        const selectedVal = document.getElementById('subLevelSelect').value;
        let baseData = currentLevelData;

        // 1. 級距範圍過濾
        if (selectedVal !== 'all') {
            const groupIndex = parseInt(selectedVal, 10);
            const startIndex = groupIndex * 100;
            const endIndex = startIndex + 100;
            baseData = currentLevelData.slice(startIndex, endIndex);
        }

        // 2. 狀態選單過濾 (全部, 已背誦, 未背誦, 精熟單字, 錯誤單字, 標記單字)
        const statusFilter = document.getElementById('statusFilterSelect').value;
        if (statusFilter === 'studied') {
            baseData = baseData.filter(item => studiedWords[item.word] === true);
        } else if (statusFilter === 'unstudied') {
            baseData = baseData.filter(item => !studiedWords[item.word]);
        } else if (statusFilter === 'mastered') {
            baseData = baseData.filter(item => (testStats[item.word] || 0) >= 4);
        } else if (statusFilter === 'wrong') {
            baseData = baseData.filter(item => wrongWords[item.word] === true);
        } else if (statusFilter === 'starred') {
            baseData = baseData.filter(item => starredWords[item.word] === true);
        }

        // 3. 搜尋關鍵字過濾
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        if (keyword) {
            baseData = baseData.filter(item => 
                item.word.toLowerCase().includes(keyword) || 
                item.definition.includes(keyword)
            );
        }

        renderCards(baseData);
    }

    function searchWord() {
        filterSubLevel();
    }

    function openTestView(element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (element) element.classList.add('active');

        document.getElementById('vocabView').style.display = 'none';
        document.getElementById('testView').style.display = 'block';
    }

    function renderCards(dataList) {
        const grid = document.getElementById('flashcardGrid');
        grid.innerHTML = '';
        if (!Array.isArray(dataList) || dataList.length === 0) {
            grid.innerHTML = '<div style="color:var(--muted); padding:20px;">此條件下目前無單字。</div>';
            return;
        }

        dataList.forEach(item => {
            const isStudied = studiedWords[item.word] === true;
            const correctCount = testStats[item.word] || 0;
            const isMastered = correctCount >= 4;
            const isWrong = wrongWords[item.word] === true;
            const isStarred = starredWords[item.word] === true;

            const card = document.createElement('div');
            card.className = `flashcard-item ${isStudied ? 'is-studied' : ''} ${isWrong ? 'is-wrong' : ''} ${isMastered ? 'is-mastered' : ''} ${isStarred ? 'is-starred' : ''}`;
            card.onclick = () => openCardDetail(item);
            card.innerHTML = `
                <div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="flashcard-word">${item.word}</div>
                        <div style="display:flex; gap:4px; align-items:center;">
                            ${isStarred ? '<span style="font-size:12px;" title="已標記">⭐</span>' : ''}
                            ${isMastered ? '<span style="font-size:10px; background:#dcfce7; color:#15803d; padding:2px 6px; border-radius:10px; font-weight:700;">精熟</span>' : ''}
                        </div>
                    </div>
                    <div class="flashcard-meta">${item.pos || ''} | ${item.kk || ''}</div>
                    <div class="flashcard-def">${item.definition}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openCardDetailFromDay(wordStr, dateStr = getTodayYYYYMMDD()) {
        let found = currentLevelData.find(x => x.word.toLowerCase() === wordStr.toLowerCase());
        let item = found || { word: wordStr, definition: '舊記錄單字', pos: '', kk: '', derivatives: [], root: '', phrases: [] };
        openCardDetail(item, dateStr);
    }

    // 支援接收自訂日期 (解決取消昨日打卡卻誤扣今日的問題)
    function openCardDetail(item, customDate = null) {
        activeCardData = item;
        document.getElementById('modalWordTitle').innerText = item.word;
        document.getElementById('modalWordMeta').innerText = `${item.pos || ''} | ${item.kk || ''}`;
        document.getElementById('modalWordDefinition').innerText = item.definition;

        const derivArea = document.getElementById('modalDerivatives');
        derivArea.innerHTML = '';
        if(item.derivatives && item.derivatives.length > 0) {
            item.derivatives.forEach(d => {
                derivArea.innerHTML += `<div><strong>${d.word}</strong> (${d.pos}): ${d.meaning}</div>`;
            });
        } else derivArea.innerText = '無';

        document.getElementById('modalRoot').innerText = item.root || '無';

        const phraseArea = document.getElementById('modalPhrases');
        phraseArea.innerHTML = '';
        if(item.phrases && item.phrases.length > 0) {
            item.phrases.forEach(p => {
                phraseArea.innerHTML += `<div><strong>${p.phrase}</strong> (${p.meaning})<br><span style="color:var(--primary);">${p.sentence}</span></div>`;
            });
        } else phraseArea.innerText = '無';

        const isWrongWord = !!wrongWords[item.word];
        const wrongBtn = document.getElementById('modalWrongBtn');
        wrongBtn.style.display = isWrongWord ? 'block' : 'none';

        const isStarred = !!starredWords[item.word];
        const starBtn = document.getElementById('modalStarBtn');
        starBtn.style.opacity = isStarred ? '1' : '0.3';
        starBtn.title = isStarred ? '取消標記單字' : '點擊標記單字';

        document.getElementById('cardCustomDate').value = customDate || getTodayYYYYMMDD();

        const isStudied = studiedWords[item.word];
        const btn = document.getElementById('modalStudiedBtn');
        btn.innerText = isStudied ? '取消背誦標記' : '標記為背誦';
        btn.className = isStudied ? 'btn-secondary' : '';

        document.getElementById('cardDetailModal').style.display = 'flex';
    }

    function closeCardModal() { document.getElementById('cardDetailModal').style.display = 'none'; }

    function toggleStarStatus() {
        if (!activeCardData) return;
        const word = activeCardData.word;
        const currentStarred = !!starredWords[word];
        const newStarred = !currentStarred;

        if (newStarred) {
            starredRef.child(word).set(true);
        } else {
            starredRef.child(word).remove();
        }

        const starBtn = document.getElementById('modalStarBtn');
        starBtn.style.opacity = newStarred ? '1' : '0.3';
        starBtn.title = newStarred ? '取消標記單字' : '點擊標記單字';
    }

    function toggleWrongStatus() {
        if (!activeCardData) return;
        wrongRef.child(activeCardData.word).remove();
        closeCardModal();
        alert(`已將 "${activeCardData.word}" 從錯誤單字移除！`);
    }

    function toggleCardStudied() {
        if (!activeCardData) return;
        const word = activeCardData.word;
        const targetDate = document.getElementById('cardCustomDate').value.trim() || getTodayYYYYMMDD();

        if (targetDate.length !== 8 || isNaN(targetDate)) {
            alert('請輸入標準 8 位數日期格式 (如: 20261107)');
            return;
        }

        const currentStatus = !!studiedWords[word];
        const newStatus = !currentStatus;

        studiedRef.child(word).set(newStatus);

        let currentCount = vocabData[targetDate] || 0;
        if (newStatus) {
            currentCount++;
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            dayWordsRef.child(targetDate).child(word).set(activeCardData);
        } else {
            currentCount = Math.max(0, currentCount - 1);
            dayWordsRef.child(targetDate).child(word).remove();
        }
        vocabRef.child(targetDate).set(currentCount);

        closeCardModal();

        if (document.getElementById('dayDetailModal').style.display === 'flex') {
            showDayDetails(targetDate);
        }
    }

    function openAddWordModal() { document.getElementById('addWordModal').style.display = 'flex'; }
    function closeAddWordModal() { document.getElementById('addWordModal').style.display = 'none'; }

    function saveNewWord() {
        const word = document.getElementById('newWord').value.trim();
        const pos = document.getElementById('newPos').value.trim();
        const kk = document.getElementById('newKk').value.trim();
        const definition = document.getElementById('newDef').value.trim();
        const root = document.getElementById('newRoot').value.trim();
        const rawDerivatives = document.getElementById('newDerivatives').value.trim();
        const rawPhrases = document.getElementById('newPhrases').value.trim();

        if (!word || !definition) {
            alert('請至少填寫單字與中文定義！');
            return;
        }

        let derivatives = [];
        if (rawDerivatives) {
            rawDerivatives.split(',').forEach(item => {
                const parts = item.split('|');
                if (parts.length >= 3) {
                    derivatives.push({ word: parts[0].trim(), pos: parts[1].trim(), meaning: parts[2].trim() });
                }
            });
        }

        let phrases = [];
        if (rawPhrases) {
            rawPhrases.split(',').forEach(item => {
                const parts = item.split('|');
                if (parts.length >= 3) {
                    phrases.push({ phrase: parts[0].trim(), meaning: parts[1].trim(), sentence: parts[2].trim() });
                }
            });
        }

        const newObj = { word, pos, kk, definition, root, derivatives, phrases };
        
        let customKey = 'custom_' + currentFileName;
        let localCustom = JSON.parse(localStorage.getItem(customKey) || '[]');
        localCustom.push(newObj);
        localStorage.setItem(customKey, JSON.stringify(localCustom));

        currentLevelData.push(newObj);
        filterSubLevel();
        closeAddWordModal();
        alert(`已成功新增 "${word}" 並永久儲存至此分類！`);
    }

    function speakCurrentWord() {
        if(activeCardData && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(activeCardData.word);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }
    }

    async function init() {
        await checkAndInitDatabase();

        fetchLevelData('level1.json');
        initChart();

        vocabRef.on('value', snap => {
            vocabData = snap.val() || {};
            renderCalendar();
            updateStats();
            updateChart();
        });

        studiedRef.on('value', snap => {

            filterSubLevel();
        });

        statsRef.on('value', snap => {
            testStats = snap.val() || {};
            updateStats();
            filterSubLevel();
        });

        dayWordsRef.on('value', snap => {
            dayWordsData = snap.val() || {};
        });

        wrongRef.on('value', snap => {
            wrongWords = snap.val() || {};
            updateStats();
            filterSubLevel();
        });

        starredRef.on('value', snap => {
            starredWords = snap.val() || {};
            updateStats();
            filterSubLevel();
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const y = currentDate.getFullYear(), m = currentDate.getMonth();
        document.getElementById('calendarTitle').innerText = `${y}年 ${m + 1}月`;

        ['日','一','二','三','四','五','六'].forEach(w => {
            grid.innerHTML += `<div class="calendar-day-header">${w}</div>`;
        });

        const firstDay = new Date(y, m, 1).getDay();
        const days = new Date(y, m + 1, 0).getDate();

        for(let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

        for(let d = 1; d <= days; d++) {
            const dateStr8 = `${y}${String(m + 1).padStart(2, '0')}${String(d).padStart(2, '0')}`;
            const val = vocabData[dateStr8];
            grid.innerHTML += `
                <div class="calendar-day ${val ? 'has-data' : ''}" onclick="showDayDetails('${dateStr8}')">
                    <span>${d}</span>
                    ${val ? `<div class="count-badge">+${val}</div>` : ''}
                </div>
            `;
        }
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    // 日曆彈窗內移除「已打卡 ✓」，並帶入該日日期給彈出卡片
    function showDayDetails(dateStr) {
        activeSelectedDate = dateStr;
        document.getElementById('dayDetailTitle').innerText = `${formatYYYYMMDDToStandard(dateStr)} 打卡記錄`;
        document.getElementById('clearDayBtn').style.display = 'block';
        document.getElementById('testDayBtn').style.display = 'inline-block';
        
        const listDiv = document.getElementById('dayDetailList');
        listDiv.innerHTML = '';

        const wordsObj = dayWordsData[dateStr];
        if (!wordsObj || Object.keys(wordsObj).length === 0) {
            listDiv.innerHTML = '<div style="color:var(--muted); padding:10px;">當日無記錄詳細單字。</div>';
        } else {
            const gridContainer = document.createElement('div');
            gridContainer.style.display = 'grid';
            gridContainer.style.gridTemplateColumns = 'repeat(2, 1fr)';
            gridContainer.style.gap = '10px';

            for (const [w, itemData] of Object.entries(wordsObj)) {
                let foundFull = currentLevelData.find(x => x.word.toLowerCase() === w.toLowerCase());
                const item = foundFull || ((typeof itemData === 'object' && itemData !== null) ? itemData : { word: w, definition: itemData, pos: '', kk: '', derivatives: [], root: '', phrases: [] });

                const miniCard = document.createElement('div');
                miniCard.style.cssText = "background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s;";
                // 傳入 dateStr 讓取消標記時能夠鎖定當天日期
                miniCard.onclick = () => openCardDetail(item, dateStr);
                
                miniCard.innerHTML = `
                    <div style="font-weight: 700; font-size: 1rem; color: var(--text);">${item.word}</div>
                    <div style="font-size: 12px; color: var(--muted); margin-top:2px;">${item.pos || ''} ${item.kk || ''}</div>
                    <div style="font-size: 13px; color: #334155; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.definition}</div>
                `;
                gridContainer.appendChild(miniCard);
            }
            listDiv.appendChild(gridContainer);
        }
        document.getElementById('dayDetailModal').style.display = 'flex';
    }

    function closeDayModal() {
        document.getElementById('dayDetailModal').style.display = 'none';
    }

    function updateStats() {
        let todayStr8 = getTodayYYYYMMDD();
        let todayCount = vocabData[todayStr8] || 0;
        let monthCount = 0;
        let yearCount = 0;

        const currentYearStr = String(new Date().getFullYear());
        const currentMonthPrefix = `${currentYearStr}${String(new Date().getMonth() + 1).padStart(2, '0')}`;

        for (const [dateStr, val] of Object.entries(vocabData)) {
            if (typeof val === 'number') {
                if (dateStr.startsWith(currentYearStr)) yearCount += val;
                if (dateStr.startsWith(currentMonthPrefix)) monthCount += val;
            }
        }

        let masteredCount = 0;
        for (const [w, c] of Object.entries(testStats)) {
            if (c >= 4) masteredCount++;
        }

        let wrongCount = Object.keys(wrongWords).length;
        let starredCount = Object.keys(starredWords).length;

        document.getElementById('statToday').innerText = todayCount;
        document.getElementById('statMonth').innerText = monthCount;
        document.getElementById('statYear').innerText = yearCount;
        document.getElementById('statMastered').innerText = masteredCount;
        document.getElementById('statWrong').innerText = wrongCount;
        document.getElementById('statStarred').innerText = starredCount;
    }

    function initChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: [], 
                datasets: [{ data: [], backgroundColor: '#4f46e5' }] 
            },
            options: { 
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
        updateChart();
    }

    function switchChartRange(range) {
        currentChartRange = range;
        ['week', 'month', 'year'].forEach(r => {
            const btn = document.getElementById(`btn-${r}`);
            btn.className = (r === range) ? '' : 'btn-secondary';
        });
        updateChart();
    }

    function updateChart() {
        if (!chartInstance) return;

        let labels = [];
        let dataVals = [];
        const baseDate = new Date(); 

        if (currentChartRange === 'week') {
            for (let i = 6; i >= 0; i--) {
                const d = new Date(baseDate);
                d.setDate(baseDate.getDate() - i);
                const m = d.getMonth() + 1;
                const day = d.getDate();
                const dateStr8 = `${d.getFullYear()}${String(m).padStart(2, '0')}${String(day).padStart(2, '0')}`;
                
                labels.push(`${String(m).padStart(2, '0')}/${String(day).padStart(2, '0')}`);
                dataVals.push(vocabData[dateStr8] || 0);
            }
        } else if (currentChartRange === 'month') {
            const y = baseDate.getFullYear();
            const m = baseDate.getMonth();
            const daysInMonth = new Date(y, m + 1, 0).getDate();
            const monthStr = String(m + 1).padStart(2, '0');

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr8 = `${y}${monthStr}${String(d).padStart(2, '0')}`;
                labels.push(`${d}日`);
                dataVals.push(vocabData[dateStr8] || 0);
            }
        } else if (currentChartRange === 'year') {
            labels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
            dataVals = new Array(12).fill(0);
            const currentYearStr = String(baseDate.getFullYear());

            for (const [dateStr, val] of Object.entries(vocabData)) {
                if (dateStr.startsWith(currentYearStr) && typeof val === 'number' && dateStr.length === 8) {
                    const monthIdx = parseInt(dateStr.substring(4, 6), 10) - 1;
                    if (monthIdx >= 0 && monthIdx < 12) {
                        dataVals[monthIdx] += val;
                    }
                }
            }
        }

        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = dataVals;
        chartInstance.update();
    }

    function toggleTestSource() {
        const source = document.getElementById('testSource').value;
        document.getElementById('dateRangeGroup').style.display = (source === 'date') ? 'block' : 'none';
    }

    function startTest() {
        const testType = document.getElementById('testType').value;
        const count = parseInt(document.getElementById('testCount').value, 10);
        const source = document.getElementById('testSource').value;
        
        let pool = [];
        if (source === 'level') {
            const subVal = document.getElementById('subLevelSelect').value;
            if (subVal === 'all') {
                pool = [...currentLevelData];
            } else {
                const groupIdx = parseInt(subVal, 10);
                pool = currentLevelData.slice(groupIdx * 100, (groupIdx + 1) * 100);
            }
        } else {
            const startDate = document.getElementById('testStartDateInput').value.trim();
            const endDate = document.getElementById('testEndDateInput').value.trim();

            if (!startDate || !endDate || startDate.length !== 8 || isNaN(startDate) || isNaN(endDate)) {
                alert('請輸入正確的 8 位數起訖日期 (格式: YYYYMMDD)');
                return;
            }

            let collectedWordsMap = {};
            for (const [dateKey, wordsObj] of Object.entries(dayWordsData)) {
                if (dateKey >= startDate && dateKey <= endDate) {
                    if (wordsObj && typeof wordsObj === 'object') {
                        for (const [w, itemData] of Object.entries(wordsObj)) {
                            collectedWordsMap[w] = itemData;
                        }
                    }
                }
            }

            pool = Object.entries(collectedWordsMap).map(([w, itemData]) => {
                let found = currentLevelData.find(x => x.word.toLowerCase() === w.toLowerCase());
                return found || ((typeof itemData === 'object' && itemData !== null) ? itemData : { word: w, definition: itemData });
            });
        }

        if (pool.length === 0) {
            alert('所選範圍無可用單字題庫！');
            return;
        }

        pool.sort(() => Math.random() - 0.5);
        currentTestQuestions = pool.slice(0, count);

        const container = document.getElementById('testContainer');
        container.innerHTML = '';
        document.getElementById('testCardArea').style.display = 'block';

        currentTestQuestions.forEach((q, idx) => {
            let html = `<div style="margin-bottom:20px; padding:15px; border:1px solid var(--border); border-radius:8px;">`;
            html += `<div style="font-weight:600; margin-bottom:10px;">第 ${idx + 1} 題</div>`;
            
            if (testType === 'choice') {
                html += `<div style="font-size:1.1rem; margin-bottom:10px;">英文: <strong>${q.word}</strong></div>`;
                let options = [q.definition];
                while(options.length < 4 && currentLevelData.length >= 4) {
                    let randItem = currentLevelData[Math.floor(Math.random() * currentLevelData.length)];
                    if (!options.includes(randItem.definition)) options.push(randItem.definition);
                }
                options.sort(() => Math.random() - 0.5);

                options.forEach(opt => {
                    html += `<label style="display:block; margin-bottom:6px; cursor:pointer;"><input type="radio" name="q_${idx}" value="${opt === q.definition ? 'correct' : 'wrong'}" data-word="${q.word}"> ${opt}</label>`;
                });
            } else {
                html += `<div style="font-size:1.1rem; margin-bottom:10px;">中文定義: <strong>${q.definition}</strong></div>`;
                html += `<input type="text" class="fill-input" data-index="${idx}" data-answer="${q.word}" placeholder="請輸入英文拼寫..." style="padding:6px; width:100%; border:1px solid var(--border); border-radius:6px;">`;
            }
            html += `</div>`;
            container.innerHTML += html;
        });

        container.innerHTML += `<button onclick="submitTest('${testType}')">繳交測驗</button>`;
    }

    function submitTest(type) {
        let score = 0;
        let resultsHtml = `<h2 style="color:var(--primary); margin-bottom:16px;">測驗結果與詳解</h2>`;

        currentTestQuestions.forEach((q, i) => {
            let isCorrect = false;
            let userAnsDisplay = "";
            let correctAnsDisplay = (type === 'choice') ? q.definition : q.word;

            if (type === 'choice') {
                const selected = document.querySelector(`input[name="q_${i}"]:checked`);
                userAnsDisplay = selected ? selected.parentNode.textContent.trim() : "未作答";
                if (selected && selected.value === 'correct') {
                    isCorrect = true;
                }
            } else {
                const input = document.querySelector(`input[data-index="${i}"]`);
                userAnsDisplay = input ? input.value.trim() : "";
                if (userAnsDisplay.toLowerCase() === q.word.toLowerCase()) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                score++;
                let curStats = testStats[q.word] || 0;
                statsRef.child(q.word).set(curStats + 1);
            } else {
                wrongRef.child(q.word).set(true);
            }

            resultsHtml += `
                <div style="padding: 12px 16px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border); background: ${isCorrect ? '#f0fdf4' : '#fef2f2'}; border-color: ${isCorrect ? '#bbf7d0' : '#fecaca'};">
                    <div style="font-weight: 700; margin-bottom: 4px;">第 ${i + 1} 題：${type === 'choice' ? q.word : q.definition} ${isCorrect ? '✅' : '❌'}</div>
                    <div style="font-size: 14px; color: var(--muted);">你的回答：<span style="color: ${isCorrect ? '#166534' : '#991b1b'}; font-weight: 600;">${userAnsDisplay || '無'}</span></div>
                    ${!isCorrect ? `<div style="font-size: 14px; color: #166534; margin-top: 2px; font-weight: 600;">正確答案：${correctAnsDisplay}</div>` : ''}
                </div>
            `;
        });

        const finalScoreHtml = `<div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 20px;">總得分：${score} / ${currentTestQuestions.length}</div>`;
        const container = document.getElementById('testContainer');
        container.innerHTML = `<h2 style="color:var(--primary); margin-bottom:16px;">測驗結果與詳解</h2>` + finalScoreHtml + resultsHtml + `<button onclick="startTest()" style="margin-top: 16px;">再考一次</button>`;

        if (score === currentTestQuestions.length) {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }
    }

    window.onload = init;
</script>
</body>
</html>
