<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字背誦進度追蹤器</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 HTML5 Drag and Drop 輔助套件 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            scroll-behavior: smooth;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .full-width-card {
            max-width: 1000px;
            margin: 20px auto 0;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .header-area { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.25rem; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .date-selects { display: flex; gap: 5px; }
        select, input, button {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        .btn-group { display: flex; gap: 6px; }
        .btn-group button {
            padding: 6px 12px;
            font-size: 12px;
            background: #e2e8f0;
            color: #475569;
            border-radius: 20px;
        }
        .btn-group button.active { background: var(--primary); color: white; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stat-item {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.85rem; color: #64748b; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .calendar-day-header { font-weight: bold; padding: 5px; color: #64748b; }
        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .calendar-day:hover { background: #e0e7ff; }
        .calendar-day.has-data { background: #eef2ff; border-color: #818cf8; }
        .count-badge { font-weight: bold; color: var(--primary); font-size: 10px; }
        .sync-status { font-size: 12px; color: #10b981; font-weight: bold; }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .search-input {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            outline: none;
            width: 180px;
            transition: width 0.3s;
        }
        .search-input:focus {
            width: 220px;
            border-color: var(--primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: grab;
        }
        .word-item:active { cursor: grabbing; }
        .word-tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin: 0 4px;
        }
        .action-btn {
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: #ef4444; color: white; }
        .search-result-item {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-result-item:hover { background: #f1f5f9; }
        .drag-handle { color: #94a3b8; margin-right: 8px; cursor: grab; }

        /* 進度條與目標樣式 */
        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* 測驗區專用樣式 */
        .quiz-option-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            background: #f8fafc;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .quiz-option-btn:hover {
            background: #e0e7ff;
            border-color: #818cf8;
        }
        .quiz-option-btn.correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d;
            font-weight: bold;
        }
        .quiz-option-btn.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c;
        }
    </style>
</head>
<body>

<div class="header-area" style="max-width: 1000px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center;">
    <div>
        <h1 style="margin:0;">📚 單字背誦進度追蹤器</h1>
        <span class="sync-status" id="syncStatus">☁️ 正在連線至雲端...</span>
    </div>
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋單字或翻譯..." onkeypress="handleSearchKey(event)">
        <button onclick="searchWord()" style="border-radius: 20px; padding: 8px 16px;">搜尋</button>
    </div>
</div>

<div class="container">
    <div>
        <div class="card">
            <h2>⚡ 單字打卡</h2>
            <div class="input-group">
                <label>選擇日期：</label>
                <div class="date-selects">
                    <select id="yearSelect"></select>
                    <select id="monthSelect"></select>
                    <select id="daySelect"></select>
                </div>
                <label>背誦單字量：</label>
                <input type="number" id="vocabCount" min="1" placeholder="輸入數量...">
                <label>打卡模式：</label>
                <select id="modeSelect">
                    <option value="add">➕ 累加數量</option>
                    <option value="overwrite">✏️ 直接修改(覆蓋)</option>
                </select>
                <button onclick="submitData()">紀錄單字 💾</button>
            </div>
        </div>

        <div class="card">
            <h2>📊 學習統計</h2>
            <div class="stat-grid">
                <div class="stat-item"><div class="stat-value" id="statToday">0</div><div class="stat-label">今日累積</div></div>
                <div class="stat-item"><div class="stat-value" id="statWeek">0</div><div class="stat-label">本週累積</div></div>
                <div class="stat-item"><div class="stat-value" id="statMonth">0</div><div class="stat-label">本月累積</div></div>
                <div class="stat-item"><div class="stat-value" id="statYear">0</div><div class="stat-label">今年累積</div></div>
            </div>

            <!-- 🎯 目標設定與達成進度 -->
            <h3 style="margin-top:20px; margin-bottom:10px; font-size:1.05rem; color:var(--primary);">🎯 學習目標設定</h3>
            <div style="background:#f8fafc; border:1px solid var(--border); padding:12px; border-radius:8px; font-size:13px;">
                <div style="margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <label style="font-weight:bold;">今日目標：</label>
                        <input type="number" id="dailyGoalInput" style="width:60px; padding:4px; font-size:12px;" min="1" placeholder="個" onchange="saveGoals()">
                    </div>
                    <div id="dailyGoalText" style="color:#64748b;">已達成 0 / 0 個 (0%)</div>
                    <div class="progress-bar-container"><div id="dailyProgressBar" class="progress-bar-fill"></div></div>
                </div>

                <div style="margin-top:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <label style="font-weight:bold;">本月目標：</label>
                        <input type="number" id="monthlyGoalInput" style="width:60px; padding:4px; font-size:12px;" min="1" placeholder="個" onchange="saveGoals()">
                    </div>
                    <div id="monthlyGoalText" style="color:#64748b;">已達成 0 / 0 個 (0%)</div>
                    <div class="progress-bar-container"><div id="monthlyProgressBar" class="progress-bar-fill"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div>
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 id="calendarTitle" style="margin:0;">📅 月曆打卡紀錄</h2>
                <div>
                    <button onclick="changeMonth(-1)">◀</button>
                    <button onclick="changeMonth(1)">▶</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="margin:0;">🚀 背誦趨勢圖表</h2>
                <div class="btn-group">
                    <button id="btn-week" class="active" onclick="switchChartRange('week')">本週</button>
                    <button id="btn-month" onclick="switchChartRange('month')">本月</button>
                    <button id="btn-year" onclick="switchChartRange('year')">今年</button>
                </div>
            </div>
            <canvas id="trendChart" height="120"></canvas>
        </div>
    </div>
</div>

<!-- 🧠 測驗練習區 -->
<div class="full-width-card" id="quizSection">
    <div class="card">
        <h2>🧠 測驗練習區</h2>
        
        <!-- 測驗設定介面 -->
        <div id="quizSetupArea">
            <p id="quizSetupDesc" style="color:#64748b; margin-top:0;">自動抓取您資料庫中的單字進行測驗，快來考考自己的記憶力吧！</p>
            <div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom:15px;">
                <div>
                    <label style="font-weight:bold; display:block; margin-bottom:5px;">題型：</label>
                    <select id="quizTypeSelect">
                        <option value="choice">🎯 四選一單選題</option>
                        <option value="fill">✍️ 拼字填空題</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight:bold; display:block; margin-bottom:5px;">題數：</label>
                    <select id="quizCountSelect">
                        <option value="5">5 題</option>
                        <option value="10" selected>10 題</option>
                        <option value="20">20 題</option>
                        <option value="all">全部單字</option>
                    </select>
                </div>
            </div>
            <button onclick="startQuiz()" style="font-size:16px; padding:10px 24px;">🚀 開始測驗</button>
            <button id="resetQuizFilterBtn" onclick="resetQuizFilter()" style="display:none; font-size:14px; padding:10px 16px; background:#64748b; margin-left:8px;">🔄 切換為全單字庫測驗</button>
        </div>

        <!-- 測驗進行中介面 -->
        <div id="quizPlayArea" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #e2e8f0;">
                <span id="quizProgress" style="font-weight:bold; color:var(--primary);">題目 1 / 10</span>
                <span id="quizScore" style="color:#10b981; font-weight:bold;">得分：0</span>
            </div>

            <div style="background:#f1f5f9; padding:20px; border-radius:10px; text-align:center; margin-bottom:20px;">
                <div id="quizPosTag" class="word-tag" style="display:inline-block; font-size:13px; margin-bottom:8px;">adj.</div>
                <h2 id="quizQuestion" style="font-size:1.8rem; margin:5px 0; color:#1e293b;">中文題目顯示區</h2>
            </div>

            <!-- 四選一選項區 -->
            <div id="quizChoiceOptions"></div>

            <!-- 填空輸入區 -->
            <div id="quizFillOption" style="display:none;">
                <input type="text" id="quizFillInput" placeholder="請輸入正確的英文單字..." style="width:100%; box-sizing:border-box; margin-bottom:10px; font-size:16px; padding:12px;" onkeypress="handleQuizFillKey(event)">
                <button onclick="submitFillAnswer()" style="width:100%; padding:12px; font-size:16px;">提交答案 ↵</button>
            </div>

            <div id="quizFeedback" style="margin-top:15px; font-weight:bold; text-align:center; font-size:16px; min-height:24px;"></div>
            
            <div style="text-align:right; margin-top:15px;">
                <button id="nextQuizBtn" onclick="nextQuestion()" style="display:none; padding:8px 20px;">下一題 ➔</button>
            </div>
        </div>

        <!-- 測驗結束介面 -->
        <div id="quizResultArea" style="display:none; text-align:center; padding:20px 0;">
            <h3 style="font-size:1.5rem; color:var(--primary); margin-top:0;">🎉 測驗完成！</h3>
            <p id="quizFinalSummary" style="font-size:1.2rem; color:#334155;">您的得分：100 分</p>
            <button onclick="resetQuiz()" style="padding:10px 24px; font-size:15px;">🔄 再測驗一次</button>
        </div>
    </div>
</div>

<!-- 點擊日期彈出的詳細視窗 -->
<div class="modal" id="dayModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="modalDateTitle" style="margin:0; color:var(--primary);">📅 日期詳細內容</h3>
            <button onclick="closeModal()" style="background:#cbd5e1; color:#334155;">✖ 關閉</button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; background:#f1f5f9; padding:12px; border-radius:8px; margin-bottom:15px;">
            <div>
                <label style="font-weight:bold;">今日背誦總量：</label>
                <input type="number" id="modalCountInput" style="width:70px;" min="0">
                <button onclick="saveModalChanges()" style="padding:6px 10px;">儲存 💾</button>
            </div>
            <button onclick="startQuizForSelectedDate()" style="background:#10b981; padding:6px 12px; font-size:13px;">🧠 測驗今日單字</button>
        </div>

        <h4 id="formTitle">📖 新增詳細單字列表</h4>
        <div class="input-group" style="background:#fff; border:1px solid #e2e8f0; padding:12px; border-radius:8px;">
            <input type="text" id="wordEnglish" placeholder="英文單字 (例如: happy)">
            <select id="wordPos">
                <option value="n.">n. 名詞</option>
                <option value="v.">v. 動詞</option>
                <option value="adj.">adj. 形容詞</option>
                <option value="adv.">adv. 副詞</option>
                <option value="prep.">prep. 介系詞</option>
                <option value="conj.">conj. 連接詞</option>
                <option value="pron.">pron. 代名詞</option>
                <option value="suffix">suffix 字尾</option>
            </select>
            <input type="text" id="wordChinese" placeholder="中文翻譯 (例如: 開心的)">
            <button id="saveWordBtn" onclick="addOrUpdateWordDetail()">➕ 新增至今天單字庫</button>
            <button id="cancelEditBtn" onclick="resetWordForm()" style="display:none; background:#94a3b8;">取消編輯</button>
        </div>

        <h4 style="margin-top:15px;">📋 今日單字清單 <span style="font-size:12px; color:#64748b; font-weight:normal;">(拖曳調整順序後，記得點「儲存」)</span></h4>
        <div id="wordListArea"></div>
    </div>
</div>

<!-- 搜尋結果彈出視窗 -->
<div class="modal" id="searchModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="searchModalTitle" style="margin:0; color:var(--primary);">🔍 搜尋結果</h3>
            <button onclick="closeSearchModal()" style="background:#cbd5e1; color:#334155;">✖ 關閉</button>
        </div>
        <div id="searchResultsArea"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD37inAxxk88gZzfnl1t3iiU4HnbwhW104",
        authDomain: "vocab-app-1c855.firebaseapp.com",
        databaseURL: "https://vocab-app-1c855-default-rtdb.firebaseio.com",
        projectId: "vocab-app-1c855",
        storageBucket: "vocab-app-1c855.firebasestorage.app",
        messagingSenderId: "642166474550",
        appId: "1:642166474550:web:c397de3f1d8f0826d29597",
        measurementId: "G-3CN17KSP9Z"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const vocabRef = db.ref('vocabData');
    const wordListRef = db.ref('wordDetails');
    const goalsRef = db.ref('goals');

    let vocabData = {};
    let wordDetails = {};
    let goalsData = { daily: 10, monthly: 100 };
    let selectedDateStr = "";
    let editingWordKey = null;
    let currentDate = new Date();
    let chartInstance = null;
    let currentChartRange = 'week';
    let sortableInstance = null;
    let currentTempWords = {}; 

    // 測驗系統相關變數
    let allWordPool = [];
    let customQuizPool = null; // 當天單字測驗專用 Pool
    let quizQuestions = [];
    let currentQuizIndex = 0;
    let quizScore = 0;
    let currentQuizType = 'choice';
    let isAnswered = false;

    function init() {
        initDateDropdowns();
        initChart();
        
        vocabRef.on('value', (snapshot) => {
            vocabData = snapshot.val() || {};
            renderCalendar();
            updateStats();
            updateChart();
            document.getElementById('syncStatus').innerText = '☁️ 雲端同步完成';
        });

        wordListRef.on('value', (snapshot) => {
            wordDetails = snapshot.val() || {};
            if (selectedDateStr) renderWordList();
        });

        goalsRef.on('value', (snapshot) => {
            if (snapshot.val()) {
                goalsData = snapshot.val();
                document.getElementById('dailyGoalInput').value = goalsData.daily || 10;
                document.getElementById('monthlyGoalInput').value = goalsData.monthly || 100;
            }
            updateStats();
        });
    }

    function initDateDropdowns() {
        const ySel = document.getElementById('yearSelect');
        const mSel = document.getElementById('monthSelect');
        const dSel = document.getElementById('daySelect');
        const now = new Date();

        ySel.innerHTML = ''; mSel.innerHTML = '';
        for(let y = now.getFullYear() - 2; y <= now.getFullYear() + 2; y++) {
            ySel.add(new Option(`${y}年`, y, false, y === now.getFullYear()));
        }
        for(let m = 1; m <= 12; m++) {
            mSel.add(new Option(`${m}月`, m, false, m === (now.getMonth() + 1)));
        }
        updateDays();
        dSel.value = now.getDate();

        ySel.onchange = updateDays;
        mSel.onchange = updateDays;
    }

    function updateDays() {
        const y = parseInt(document.getElementById('yearSelect').value);
        const m = parseInt(document.getElementById('monthSelect').value);
        const dSel = document.getElementById('daySelect');
        const daysInMonth = new Date(y, m, 0).getDate();
        const currentVal = parseInt(dSel.value) || 1;
        
        dSel.innerHTML = '';
        for(let d = 1; d <= daysInMonth; d++) {
            dSel.add(new Option(`${d}日`, d, false, d === Math.min(currentVal, daysInMonth)));
        }
    }

    function saveGoals() {
        const daily = parseInt(document.getElementById('dailyGoalInput').value) || 10;
        const monthly = parseInt(document.getElementById('monthlyGoalInput').value) || 100;
        goalsData = { daily, monthly };
        goalsRef.set(goalsData);
        updateStats();
    }

    function submitData() {
        const y = document.getElementById('yearSelect').value;
        const m = String(document.getElementById('monthSelect').value).padStart(2, '0');
        const d = String(document.getElementById('daySelect').value).padStart(2, '0');
        const count = parseInt(document.getElementById('vocabCount').value);
        const mode = document.getElementById('modeSelect').value;

        if (!count || count <= 0) return alert('請輸入有效的單字數量！');

        const dateStr = `${y}-${m}-${d}`;
        let newCount = count;
        if (mode === 'add') {
            newCount = (vocabData[dateStr] || 0) + count;
        }

        vocabRef.child(dateStr).set(newCount).then(() => {
            document.getElementById('vocabCount').value = '';
            alert(`同步成功！${dateStr} 累積：${newCount} 個單字`);
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth();

        document.getElementById('calendarTitle').innerText = `📅 ${y}年 ${m + 1}月 打卡紀錄`;

        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        weekDays.forEach(w => {
            grid.innerHTML += `<div class="calendar-day-header">${w}</div>`;
        });

        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();

        for(let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div></div>`;
        }

        for(let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const val = vocabData[dateStr];
            const hasDataClass = val ? 'has-data' : '';
            const badge = val ? `<div class="count-badge">+${val}</div>` : '';
            
            grid.innerHTML += `
                <div class="calendar-day ${hasDataClass}" onclick="openModal('${dateStr}')">
                    <span>${d}</span>
                    ${badge}
                </div>
            `;
        }
    }

    function openModal(dateStr) {
        selectedDateStr = dateStr;
        resetWordForm();
        document.getElementById('modalDateTitle').innerText = `📅 ${dateStr} 詳細記錄`;
        document.getElementById('modalCountInput').value = vocabData[dateStr] || 0;
        document.getElementById('dayModal').style.display = 'flex';
        renderWordList();
    }

    function closeModal() {
        document.getElementById('dayModal').style.display = 'none';
        selectedDateStr = "";
        resetWordForm();
    }

    function handleSearchKey(e) {
        if (e.key === 'Enter') searchWord();
    }

    function searchWord() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) return alert('請輸入要搜尋的英文或中文單字！');

        const results = [];
        Object.keys(wordDetails).forEach(dateStr => {
            const dayWords = wordDetails[dateStr];
            Object.keys(dayWords).forEach(key => {
                const item = dayWords[key];
                if (item.english.toLowerCase().includes(query) || item.chinese.toLowerCase().includes(query)) {
                    results.push({ date: dateStr, word: item });
                }
            });
        });

        renderSearchResults(results, query);
    }

    function renderSearchResults(results, query) {
        const area = document.getElementById('searchResultsArea');
        area.innerHTML = '';
        document.getElementById('searchModalTitle').innerText = `🔍 搜尋「${query}」的結果`;

        if (results.length === 0) {
            area.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:20px;">找不到相關單字紀錄哦！😅</div>';
        } else {
            results.forEach(res => {
                const [y, m, d] = res.date.split('-');
                const formattedDate = `${y}年${parseInt(m)}月${parseInt(d)}日`;
                area.innerHTML += `
                    <div class="search-result-item" onclick="jumpToDate('${res.date}')">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>${res.word.english}</strong>
                            <span style="font-size:12px; color:var(--primary); font-weight:bold;">📅 ${formattedDate}</span>
                        </div>
                        <div style="font-size:13px; color:#64748b; margin-top:4px;">
                            <span class="word-tag">${res.word.pos}</span> ${res.word.chinese}
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('searchModal').style.display = 'flex';
    }

    function jumpToDate(dateStr) {
        closeSearchModal();
        const [y, m] = dateStr.split('-').map(Number);
        currentDate = new Date(y, m - 1, 1);
        renderCalendar();
        openModal(dateStr);
    }

    function closeSearchModal() {
        document.getElementById('searchModal').style.display = 'none';
    }

    function saveModalChanges() {
        const val = parseInt(document.getElementById('modalCountInput').value);
        if (isNaN(val) || val < 0) return alert('請輸入有效數量');
        
        const updates = {};
        if (val === 0) {
            updates[`vocabData/${selectedDateStr}`] = null;
        } else {
            updates[`vocabData/${selectedDateStr}`] = val;
        }

        if (currentTempWords && Object.keys(currentTempWords).length > 0) {
            Object.keys(currentTempWords).forEach(key => {
                updates[`wordDetails/${selectedDateStr}/${key}`] = currentTempWords[key];
            });
        }

        db.ref().update(updates).then(() => {
            alert('儲存成功！(數量與單字順序已寫入雲端)');
        });
    }

    function addOrUpdateWordDetail() {
        const eng = document.getElementById('wordEnglish').value.trim();
        const pos = document.getElementById('wordPos').value;
        const chi = document.getElementById('wordChinese').value.trim();

        if (!eng || !chi) return alert('請填寫完整單字與中文翻譯！');

        const dayWords = wordDetails[selectedDateStr] || {};
        const wordCount = Object.keys(dayWords).length;

        if (editingWordKey) {
            const currentOrder = dayWords[editingWordKey].order ?? wordCount;
            const wordData = { english: eng, pos: pos, chinese: chi, order: currentOrder };
            wordListRef.child(selectedDateStr).child(editingWordKey).update(wordData).then(() => {
                resetWordForm();
            });
        } else {
            const wordData = { english: eng, pos: pos, chinese: chi, order: wordCount + 1 };
            wordListRef.child(selectedDateStr).push(wordData).then(() => {
                document.getElementById('wordEnglish').value = '';
                document.getElementById('wordChinese').value = '';
            });
        }
    }

    function editWordDetail(key) {
        const item = wordDetails[selectedDateStr][key];
        if (!item) return;

        editingWordKey = key;
        document.getElementById('wordEnglish').value = item.english;
        document.getElementById('wordPos').value = item.pos;
        document.getElementById('wordChinese').value = item.chinese;

        document.getElementById('formTitle').innerText = '✏️ 編輯單字';
        document.getElementById('saveWordBtn').innerText = '💾 儲存修改';
        document.getElementById('cancelEditBtn').style.display = 'inline-block';
    }

    function resetWordForm() {
        editingWordKey = null;
        document.getElementById('wordEnglish').value = '';
        document.getElementById('wordChinese').value = '';
        document.getElementById('formTitle').innerText = '📖 新增詳細單字列表';
        document.getElementById('saveWordBtn').innerText = '➕ 新增至今天單字庫';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function deleteWordDetail(key) {
        if (confirm('確定要刪除這個單字嗎？')) {
            wordListRef.child(selectedDateStr).child(key).remove();
        }
    }

    function renderWordList() {
        const area = document.getElementById('wordListArea');
        area.innerHTML = '';
        const dayWords = wordDetails[selectedDateStr] || {};
        
        const sortedKeys = Object.keys(dayWords).sort((a, b) => {
            const orderA = dayWords[a].order ?? 0;
            const orderB = dayWords[b].order ?? 0;
            return orderA - orderB;
        });

        currentTempWords = { ...dayWords };

        if (sortedKeys.length === 0) {
            area.innerHTML = '<div style="color:#94a3b8; font-size:13px; text-align:center;">尚無詳細單字資料，快來新增吧！</div>';
            return;
        }

        sortedKeys.forEach(key => {
            const item = dayWords[key];
            area.innerHTML += `
                <div class="word-item" data-id="${key}">
                    <div>
                        <span class="drag-handle">☰</span>
                        <strong>${item.english}</strong>
                        <span class="word-tag">${item.pos}</span>
                        <span>${item.chinese}</span>
                    </div>
                    <div>
                        <button class="action-btn edit-btn" onclick="editWordDetail('${key}')">編輯 ✏️</button>
                        <button class="action-btn delete-btn" onclick="deleteWordDetail('${key}')">刪除</button>
                    </div>
                </div>
            `;
        });

        if (sortableInstance) sortableInstance.destroy();
        sortableInstance = new Sortable(area, {
            animation: 150,
            handle: '.drag-handle',
            onEnd: function () {
                const newOrderKeys = Array.from(area.querySelectorAll('.word-item')).map(el => el.getAttribute('data-id'));
                newOrderKeys.forEach((k, index) => {
                    if (currentTempWords[k]) {
                        currentTempWords[k].order = index + 1;
                    }
                });
            }
        });
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    function updateStats() {
        const now = new Date();
        const todayStr = formatDate(now);
        
        const todayVal = vocabData[todayStr] || 0;
        document.getElementById('statToday').innerText = todayVal;

        let weekSum = 0, monthSum = 0, yearSum = 0;
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        Object.keys(vocabData).forEach(dateKey => {
            const [y, m, d] = dateKey.split('-').map(Number);
            const val = vocabData[dateKey];
            
            if (y === currentYear) {
                yearSum += val;
                if (m === (currentMonth + 1)) monthSum += val;
            }

            const itemDate = new Date(y, m - 1, d);
            const diffDays = Math.floor((now - itemDate) / (1000 * 60 * 60 * 24));
            if (diffDays >= 0 && diffDays < 7) weekSum += val;
        });

        document.getElementById('statWeek').innerText = weekSum;
        document.getElementById('statMonth').innerText = monthSum;
        document.getElementById('statYear').innerText = yearSum;

        // 計算目標完成率與更新進度條
        const dailyGoal = parseInt(document.getElementById('dailyGoalInput').value) || goalsData.daily || 10;
        const monthlyGoal = parseInt(document.getElementById('monthlyGoalInput').value) || goalsData.monthly || 100;

        const dPct = Math.min(100, Math.round((todayVal / dailyGoal) * 100)) || 0;
        const mPct = Math.min(100, Math.round((monthSum / monthlyGoal) * 100)) || 0;

        document.getElementById('dailyGoalText').innerText = `已達成 ${todayVal} / ${dailyGoal} 個 (${dPct}%)`;
        document.getElementById('dailyProgressBar').style.width = `${dPct}%`;

        document.getElementById('monthlyGoalText').innerText = `已達成 ${monthSum} / ${monthlyGoal} 個 (${mPct}%)`;
        document.getElementById('monthlyProgressBar').style.width = `${mPct}%`;
    }

    function switchChartRange(range) {
        currentChartRange = range;
        document.querySelectorAll('.btn-group button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${range}`).classList.add('active');
        updateChart();
    }

    function initChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: getChartData(),
            options: { 
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, grid: { borderDash: [5, 5] } },
                    x: { grid: { display: false } }
                },
                borderRadius: 6
            }
        });
    }

    function updateChart() {
        if(chartInstance) {
            chartInstance.data = getChartData();
            chartInstance.update();
        }
    }

    function getChartData() {
        const labels = [];
        const data = [];
        const now = new Date();

        if (currentChartRange === 'week') {
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = formatDate(d);
                labels.push(`${d.getMonth()+1}/${d.getDate()}`);
                data.push(vocabData[dateStr] || 0);
            }
        } else if (currentChartRange === 'month') {
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                labels.push(`${d}日`);
                data.push(vocabData[dateStr] || 0);
            }
        } else if (currentChartRange === 'year') {
            const year = now.getFullYear();
            const monthSums = new Array(12).fill(0);

            Object.keys(vocabData).forEach(dateKey => {
                const [y, m] = dateKey.split('-').map(Number);
                if (y === year) {
                    monthSums[m - 1] += vocabData[dateKey];
                }
            });

            for (let m = 1; m <= 12; m++) {
                labels.push(`${m}月`);
                data.push(monthSums[m - 1]);
            }
        }

        return {
            labels: labels,
            datasets: [{
                label: '背誦數量',
                data: data,
                backgroundColor: '#6366f1',
                hoverBackgroundColor: '#4338ca'
            }]
        };
    }

    function formatDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    /* --- 🧠 測驗練習邏輯 --- */
    function getAllWords() {
        const pool = [];
        Object.keys(wordDetails).forEach(dateStr => {
            const dayWords = wordDetails[dateStr];
            Object.keys(dayWords).forEach(key => {
                pool.push(dayWords[key]);
            });
        });
        return pool;
    }

    // 當日單字直接測驗
    function startQuizForSelectedDate() {
        const dayWordsObj = wordDetails[selectedDateStr] || {};
        const dayWords = Object.keys(dayWordsObj).map(k => dayWordsObj[k]);

        if (dayWords.length === 0) {
            return alert(`📅 ${selectedDateStr} 這一天尚無詳細單字可以測驗哦！`);
        }

        customQuizPool = dayWords;
        closeModal();

        // 滾動到測驗區
        document.getElementById('quizSection').scrollIntoView({ behavior: 'smooth' });
        document.getElementById('quizSetupDesc').innerHTML = `📌 正在進行 <strong>📅 ${selectedDateStr}</strong> 的專屬單字測驗（共 ${dayWords.length} 個單字）`;
        document.getElementById('resetQuizFilterBtn').style.display = 'inline-block';
        resetQuiz();
    }

    function resetQuizFilter() {
        customQuizPool = null;
        document.getElementById('quizSetupDesc').innerText = '自動抓取您資料庫中的所有單字進行測驗，快來考考自己的記憶力吧！';
        document.getElementById('resetQuizFilterBtn').style.display = 'none';
        resetQuiz();
    }

    function startQuiz() {
        allWordPool = getAllWords();
        const targetPool = customQuizPool || allWordPool;

        if (targetPool.length === 0) {
            return alert('您的資料庫目前沒有單字哦！請先新增一些單字再來測驗吧！😊');
        }

        currentQuizType = document.getElementById('quizTypeSelect').value;
        const countOpt = document.getElementById('quizCountSelect').value;
        
        let targetCount = countOpt === 'all' ? targetPool.length : parseInt(countOpt);
        targetCount = Math.min(targetCount, targetPool.length);

        // 隨機洗牌抽題
        const shuffled = [...targetPool].sort(() => 0.5 - Math.random());
        quizQuestions = shuffled.slice(0, targetCount);

        currentQuizIndex = 0;
        quizScore = 0;

        document.getElementById('quizSetupArea').style.display = 'none';
        document.getElementById('quizResultArea').style.display = 'none';
        document.getElementById('quizPlayArea').style.display = 'block';

        renderQuestion();
    }

    function renderQuestion() {
        isAnswered = false;
        document.getElementById('nextQuizBtn').style.display = 'none';
        document.getElementById('quizFeedback').innerText = '';

        const currentQ = quizQuestions[currentQuizIndex];
        document.getElementById('quizProgress').innerText = `題目 ${currentQuizIndex + 1} / ${quizQuestions.length}`;
        document.getElementById('quizScore').innerText = `得分：${quizScore}`;
        document.getElementById('quizPosTag').innerText = currentQ.pos || '詞性';
        document.getElementById('quizQuestion').innerText = currentQ.chinese;

        const choiceContainer = document.getElementById('quizChoiceOptions');
        const fillContainer = document.getElementById('quizFillOption');

        if (currentQuizType === 'choice') {
            choiceContainer.style.display = 'block';
            fillContainer.style.display = 'none';
            choiceContainer.innerHTML = '';

            let options = [currentQ];
            const otherWords = allWordPool.filter(w => w.english.toLowerCase() !== currentQ.english.toLowerCase());
            const shuffledOthers = [...otherWords].sort(() => 0.5 - Math.random()).slice(0, 3);
            options = options.concat(shuffledOthers).sort(() => 0.5 - Math.random());

            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt.english}`;
                btn.onclick = () => checkChoiceAnswer(opt.english, currentQ.english, btn);
                choiceContainer.appendChild(btn);
            });
        } else {
            choiceContainer.style.display = 'none';
            fillContainer.style.display = 'block';
            const input = document.getElementById('quizFillInput');
            input.value = '';
            input.disabled = false;
            input.focus();
        }
    }

    function checkChoiceAnswer(selected, correct, btnEl) {
        if (isAnswered) return;
        isAnswered = true;

        const allBtns = document.querySelectorAll('.quiz-option-btn');
        allBtns.forEach(b => {
            if (b.innerText.includes(correct)) {
                b.classList.add('correct');
            }
        });

        if (selected.toLowerCase() === correct.toLowerCase()) {
            quizScore += Math.round(100 / quizQuestions.length);
            document.getElementById('quizFeedback').innerHTML = '<span style="color:#22c55e;">🎉 答對了！太棒了！</span>';
        } else {
            btnEl.classList.add('wrong');
            document.getElementById('quizFeedback').innerHTML = `<span style="color:#ef4444;">❌ 答錯了！正確答案是：${correct}</span>`;
        }

        document.getElementById('quizScore').innerText = `得分：${quizScore}`;
        document.getElementById('nextQuizBtn').style.display = 'inline-block';
    }

    function handleQuizFillKey(e) {
        if (e.key === 'Enter') submitFillAnswer();
    }

    function submitFillAnswer() {
        if (isAnswered) return;
        const input = document.getElementById('quizFillInput');
        const userAns = input.value.trim().toLowerCase();
        const currentQ = quizQuestions[currentQuizIndex];
        const correct = currentQ.english.trim().toLowerCase();

        if (!userAns) return alert('請輸入英文單字！');

        isAnswered = true;
        input.disabled = true;

        if (userAns === correct) {
            quizScore += Math.round(100 / quizQuestions.length);
            document.getElementById('quizFeedback').innerHTML = '<span style="color:#22c55e;">🎉 完全正確！你太厲害了！</span>';
        } else {
            document.getElementById('quizFeedback').innerHTML = `<span style="color:#ef4444;">❌ 答錯了！正確拼字是：${currentQ.english}</span>`;
        }

        document.getElementById('quizScore').innerText = `得分：${quizScore}`;
        document.getElementById('nextQuizBtn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQuizIndex++;
        if (currentQuizIndex < quizQuestions.length) {
            renderQuestion();
        } else {
            showQuizResult();
        }
    }

    function showQuizResult() {
        document.getElementById('quizPlayArea').style.display = 'none';
        document.getElementById('quizResultArea').style.display = 'block';

        document.getElementById('quizFinalSummary').innerText = `您的總得分：${quizScore} 分 (答對 ${Math.round(quizScore / (100 / quizQuestions.length))} / ${quizQuestions.length} 題)`;
    }

    function resetQuiz() {
        document.getElementById('quizResultArea').style.display = 'none';
        document.getElementById('quizPlayArea').style.display = 'none';
        document.getElementById('quizSetupArea').style.display = 'block';
    }

    window.onload = init;
</script>
</body>
</html>
