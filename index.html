<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字學習平台 - v26.11.1</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>WB</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --muted: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
            scroll-behavior: smooth;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }
        .full-width-section {
            max-width: 1100px;
            margin: 24px auto 0;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .header-area { flex-direction: column; align-items: flex-start !important; gap: 12px; }
        }
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .date-selects { display: flex; gap: 8px; }
        select, input, button {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            color: var(--text);
            outline: none;
        }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1); }
        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        
        .level-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .level-btn {
            padding: 8px 14px;
            font-size: 13px;
            background: #f1f5f9;
            color: var(--muted);
            border-radius: 6px;
            border: 1px solid var(--border);
            font-weight: 500;
        }
        .level-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .flashcard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .flashcard-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            position: relative;
        }
        .flashcard-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }
        .flashcard-word {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .flashcard-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .flashcard-def {
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
        }
        .flashcard-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
            font-size: 12px;
            color: var(--muted);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .stat-item {
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }
        .calendar-day-header { font-weight: 600; padding: 6px; color: var(--muted); font-size: 13px; }
        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background: #fff;
        }
        .calendar-day:hover { background: #f1f5f9; }
        .calendar-day.has-data { background: #eef2ff; border-color: #c7d2fe; }
        .count-badge { font-weight: 700; color: var(--primary); font-size: 11px; }
        .sync-status { font-size: 12px; color: #059669; font-weight: 600; }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-input {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            outline: none;
            width: 200px;
            transition: width 0.3s;
        }
        .search-input:focus { width: 240px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .detail-section {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .detail-section h4 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .derivative-tag {
            display: inline-block;
            background: #e2e8f0;
            color: #334155;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }
        
        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }
        .btn-secondary:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="header-area" style="max-width: 1100px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center;">
    <div>
        <h1 style="margin:0; display:flex; align-items:center; gap:10px; font-size:1.5rem;">
            單字學習平台
            <span style="font-size:12px; background:#e0e7ff; color:#4338ca; padding:2px 10px; border-radius:12px; font-weight:600;">v26.11.1</span>
        </h1>
        <span class="sync-status" id="syncStatus" style="margin-top:4px; display:inline-block;">雲端同步中</span>
    </div>
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋單字..." onkeypress="handleSearchKey(event)">
        <button onclick="searchWord()" style="border-radius: 20px; padding: 8px 16px;">搜尋</button>
    </div>
</div>

<div class="container">
    <div>
        <div class="card">
            <h2>每日紀錄</h2>
            <div class="input-group">
                <label style="font-size: 13px; font-weight: 500; color: var(--muted);">選擇日期：</label>
                <div class="date-selects">
                    <select id="yearSelect" onchange="updateModalButtonState()"></select>
                    <select id="monthSelect" onchange="updateModalButtonState()"></select>
                    <select id="daySelect" onchange="updateModalButtonState()"></select>
                </div>
                <label style="font-size: 13px; font-weight: 500; color: var(--muted);">背誦單字數量：</label>
                <input type="number" id="vocabCount" min="1" placeholder="輸入數量...">
                <label style="font-size: 13px; font-weight: 500; color: var(--muted);">模式：</label>
                <select id="modeSelect">
                    <option value="add">累加數量</option>
                    <option value="overwrite">覆蓋數量</option>
                </select>
                <button onclick="submitData()">記錄單字</button>
            </div>
        </div>

        <div class="card">
            <h2>學習統計</h2>
            <div class="stat-grid">
                <div class="stat-item"><div class="stat-value" id="statToday">0</div><div class="stat-label">今日</div></div>
                <div class="stat-item"><div class="stat-value" id="statWeek">0</div><div class="stat-label">本週</div></div>
                <div class="stat-item"><div class="stat-value" id="statMonth">0</div><div class="stat-label">本月</div></div>
                <div class="stat-item"><div class="stat-value" id="statYear">0</div><div class="stat-label">今年</div></div>
            </div>

            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);">
                <div style="margin-bottom: 12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <label style="font-size: 13px; font-weight: 600;">每日目標：</label>
                        <input type="number" id="dailyGoalInput" style="width:64px; padding:4px 8px; font-size:12px;" min="1" onchange="saveGoals()">
                    </div>
                    <div id="dailyGoalText" style="font-size:12px; color:var(--muted);">0 / 15 (0%)</div>
                    <div class="progress-bar-container"><div id="dailyProgressBar" class="progress-bar-fill"></div></div>
                </div>

                <div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <label style="font-size: 13px; font-weight: 600;">每月目標：</label>
                        <input type="number" id="monthlyGoalInput" style="width:64px; padding:4px 8px; font-size:12px;" min="1" onchange="saveGoals()">
                    </div>
                    <div id="monthlyGoalText" style="font-size:12px; color:var(--muted);">0 / 200 (0%)</div>
                    <div class="progress-bar-container"><div id="monthlyProgressBar" class="progress-bar-fill"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div>
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 id="calendarTitle" style="margin:0;">日曆打卡</h2>
                <div>
                    <button onclick="changeMonth(-1)" class="btn-secondary" style="padding:6px 12px;">&lt;</button>
                    <button onclick="changeMonth(1)" class="btn-secondary" style="padding:6px 12px;">&gt;</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 style="margin:0;">學習趨勢</h2>
                <div style="display:flex; gap:6px;">
                    <button id="btn-week" class="level-btn active" onclick="switchChartRange('week')">週</button>
                    <button id="btn-month" class="level-btn" onclick="switchChartRange('month')">月</button>
                    <button id="btn-year" class="level-btn" onclick="switchChartRange('year')">年</button>
                </div>
            </div>
            <canvas id="trendChart" height="130"></canvas>
        </div>
    </div>
</div>

<div class="full-width-section">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
            <h2 style="margin:0;">7000 大考核心單字卡</h2>
        </div>
        
        <div class="level-tabs" id="levelTabs">
            <button class="level-btn active" onclick="selectLevel('1-1000')">Level 1 (1-1000)</button>
            <button class="level-btn" onclick="selectLevel('1001-2000')">Level 2 (1001-2000)</button>
            <button class="level-btn" onclick="selectLevel('2001-3000')">Level 3 (2001-3000)</button>
            <button class="level-btn" onclick="selectLevel('3001-4000')">Level 4 (3001-4000)</button>
            <button class="level-btn" onclick="selectLevel('4001-5000')">Level 5 (4001-5000)</button>
            <button class="level-btn" onclick="selectLevel('5001-6000')">Level 6 (5001-6000)</button>
            <button class="level-btn" onclick="selectLevel('6001-7000')">Level 7 (6001-7000)</button>
        </div>

        <div class="flashcard-grid" id="flashcardGrid"></div>
    </div>
</div>

<!-- 單字詳細資料彈跳視窗 (背面) -->
<div class="modal" id="cardDetailModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
            <div>
                <h3 id="modalWordTitle" style="margin:0; font-size:1.75rem; color:var(--text);">word</h3>
                <div id="modalWordMeta" style="color:var(--muted); font-size:14px; margin-top:4px;">pos / kk</div>
            </div>
            <button onclick="closeCardModal()" class="btn-secondary" style="padding:6px 12px;">關閉</button>
        </div>

        <div style="font-size:1.1rem; font-weight:600; color:var(--primary); margin-bottom:20px;" id="modalWordDefinition">
            中文定義
        </div>

        <div class="detail-section">
            <h4>1. 衍伸單字與詞性變化</h4>
            <div id="modalDerivatives"></div>
        </div>

        <div class="detail-section">
            <h4>2. 核心字根與構詞延伸</h4>
            <div id="modalRoot" style="font-size:14px; line-height:1.6; color:#334155;"></div>
        </div>

        <div class="detail-section">
            <h4>3. 常見用法與片語例句</h4>
            <div id="modalPhrases" style="font-size:14px; line-height:1.6; color:#334155;"></div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
            <button onclick="speakCurrentWord()" class="btn-secondary">發音</button>
            <button id="modalStudiedBtn" onclick="toggleCardStudied()">標記為今日已背誦 (+1)</button>
        </div>
    </div>
</div>

<!-- 搜尋結果彈跳視窗 -->
<div class="modal" id="searchModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 id="searchModalTitle" style="margin:0;">搜尋結果</h3>
            <button onclick="closeSearchModal()" class="btn-secondary" style="padding:6px 12px;">關閉</button>
        </div>
        <div id="searchResultsArea"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD37inAxxk88gZzfnl1t3iiU4HnbwhW104",
        authDomain: "vocab-app-1c855.firebaseapp.com",
        databaseURL: "https://vocab-app-1c855-default-rtdb.firebaseio.com",
        projectId: "vocab-app-1c855",
        storageBucket: "vocab-app-1c855.firebasestorage.app",
        messagingSenderId: "642166474550",
        appId: "1:642166474550:web:c397de3f1d8f0826d29597",
        measurementId: "G-3CN17KSP9Z"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const vocabRef = db.ref('vocabData');
    const studiedWordsRef = db.ref('studiedWords');
    const goalsRef = db.ref('goals');

    let vocabData = {};
    let studiedWordsData = {};
    let goalsData = { daily: 15, monthly: 200 };
    let currentDate = new Date(2026, 10, 1); // 2026-11-01 base
    let chartInstance = null;
    let currentChartRange = 'week';
    let currentSelectedLevel = '1-1000';
    let activeCardData = null;
    let flashcardDatabase = {}; // 從 words.json 動態載入

    // 自動從同目錄的 words.json 載入單字庫
    async function loadWordsFromCloud() {
        try {
            const response = await fetch('words.json');
            if (!response.ok) throw new Error('無法讀取 words.json');
            flashcardDatabase = await response.json();
            renderFlashcards(currentSelectedLevel);
            console.log('單字庫已成功從雲端載入！');
        } catch (error) {
            console.error('載入單字庫失敗:', error);
            document.getElementById('flashcardGrid').innerHTML = '<div style="color:var(--muted); padding:20px;">載入單字庫失敗，請確認 words.json 是否存在。</div>';
        }
    }

    function init() {
        initDateDropdowns();
        initChart();
        loadWordsFromCloud(); // 👈 啟動時讀取外部 JSON
        
        vocabRef.on('value', (snapshot) => {
            vocabData = snapshot.val() || {};
            renderCalendar();
            updateStats();
            updateChart();
            document.getElementById('syncStatus').innerText = '雲端同步中';
        });

        studiedWordsRef.on('value', (snapshot) => {
            studiedWordsData = snapshot.val() || {};
            if (activeCardData) {
                updateModalButtonState();
            }
        });

        goalsRef.on('value', (snapshot) => {
            if (snapshot.val()) {
                goalsData = snapshot.val();
                document.getElementById('dailyGoalInput').value = goalsData.daily || 15;
                document.getElementById('monthlyGoalInput').value = goalsData.monthly || 200;
            } else {
                document.getElementById('dailyGoalInput').value = 15;
                document.getElementById('monthlyGoalInput').value = 200;
            }
            updateStats();
        });
    }

    function initDateDropdowns() {
        const ySel = document.getElementById('yearSelect');
        const mSel = document.getElementById('monthSelect');
        const dSel = document.getElementById('daySelect');
        
        ySel.innerHTML = ''; mSel.innerHTML = '';
        for(let y = 2024; y <= 2028; y++) {
            ySel.add(new Option(`${y}年`, y, false, y === 2026));
        }
        for(let m = 1; m <= 12; m++) {
            mSel.add(new Option(`${m}月`, m, false, m === 11));
        }
        updateDays();
        dSel.value = 1;

        ySel.onchange = updateDays;
        mSel.onchange = updateDays;
    }

    function updateDays() {
        const y = parseInt(document.getElementById('yearSelect').value);
        const m = parseInt(document.getElementById('monthSelect').value);
        const dSel = document.getElementById('daySelect');
        const daysInMonth = new Date(y, m, 0).getDate();
        const currentVal = parseInt(dSel.value) || 1;
        
        dSel.innerHTML = '';
        for(let d = 1; d <= daysInMonth; d++) {
            dSel.add(new Option(`${d}日`, d, false, d === Math.min(currentVal, daysInMonth)));
        }
        updateModalButtonState();
    }

    function selectLevel(level) {
        currentSelectedLevel = level;
        document.querySelectorAll('#levelTabs .level-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.getAttribute('onclick').includes(level)) {
                btn.classList.add('active');
            }
        });
        renderFlashcards(level);
    }

    function renderFlashcards(level) {
        const grid = document.getElementById('flashcardGrid');
        grid.innerHTML = '';
        const words = flashcardDatabase[level] || [];

        if(words.length === 0) {
            grid.innerHTML = '<div style="color:var(--muted); padding:20px;">此級距目前尚無單字。</div>';
            return;
        }

        words.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flashcard-item';
            card.onclick = () => openCardDetail(item);
            
            card.innerHTML = `
                <div>
                    <div class="flashcard-word">${item.word}</div>
                    <div class="flashcard-meta">
                        <span>${item.pos}</span>
                        <span>${item.kk}</span>
                    </div>
                    <div class="flashcard-def">${item.definition}</div>
                </div>
                <div class="flashcard-footer">
                    <span>點擊查看詳細資訊</span>
                    <span style="color:var(--primary); font-weight:600;">詳細內容 &rarr;</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openCardDetail(item) {
        activeCardData = item;
        document.getElementById('modalWordTitle').innerText = item.word;
        document.getElementById('modalWordMeta').innerText = `${item.pos} | ${item.kk}`;
        document.getElementById('modalWordDefinition').innerText = item.definition;

        const derivArea = document.getElementById('modalDerivatives');
        derivArea.innerHTML = '';
        if(item.derivatives && item.derivatives.length > 0) {
            item.derivatives.forEach(d => {
                derivArea.innerHTML += `<div style="margin-bottom:6px;"><span class="derivative-tag">${d.pos}</span> <strong>${d.word}</strong>: ${d.meaning}</div>`;
            });
        } else {
            derivArea.innerHTML = '<span style="color:var(--muted);">無</span>';
        }

        document.getElementById('modalRoot').innerText = item.root || '無';

        const phraseArea = document.getElementById('modalPhrases');
        phraseArea.innerHTML = '';
        if(item.phrases && item.phrases.length > 0) {
            item.phrases.forEach(p => {
                phraseArea.innerHTML += `<div style="margin-bottom:8px;"><strong>${p.phrase}</strong> (${p.meaning})<br><span style="color:var(--primary);">${p.sentence}</span><br><span style="color:var(--muted); font-size:13px;">${p.translation}</span></div>`;
            });
        } else {
            phraseArea.innerHTML = '<span style="color:var(--muted);">無</span>';
        }

        updateModalButtonState();
        document.getElementById('cardDetailModal').style.display = 'flex';
    }

    function updateModalButtonState() {
        if (!activeCardData) return;
        const y = document.getElementById('yearSelect').value;
        const m = String(document.getElementById('monthSelect').value).padStart(2, '0');
        const d = String(document.getElementById('daySelect').value).padStart(2, '0');
        const dateStr = `${y}-${m}-${d}`;

        const isStudied = studiedWordsData[dateStr] && studiedWordsData[dateStr][activeCardData.word];
        const btn = document.getElementById('modalStudiedBtn');

        if (isStudied) {
            btn.innerText = "已標記 (點擊可取消)";
            btn.style.background = "#059669";
        } else {
            btn.innerText = "標記為今日已背誦 (+1)";
            btn.style.background = "var(--primary)";
        }
    }

    function closeCardModal() {
        document.getElementById('cardDetailModal').style.display = 'none';
        activeCardData = null;
    }

    function speakCurrentWord() {
        if(activeCardData && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(activeCardData.word);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function toggleCardStudied() {
        if (!activeCardData) return;
        const y = document.getElementById('yearSelect').value;
        const m = String(document.getElementById('monthSelect').value).padStart(2, '0');
        const d = String(document.getElementById('daySelect').value).padStart(2, '0');
        const dateStr = `${y}-${m}-${d}`;
        const wordKey = activeCardData.word;

        const currentStatus = studiedWordsData[dateStr] && studiedWordsData[dateStr][wordKey];
        let oldVal = vocabData[dateStr] || 0;
        let newCount;

        const updates = {};
        if (currentStatus) {
            newCount = Math.max(0, oldVal - 1);
            updates[`studiedWords/${dateStr}/${wordKey}`] = null;
        } else {
            newCount = oldVal + 1;
            updates[`studiedWords/${dateStr}/${wordKey}`] = true;
        }
        updates[`vocabData/${dateStr}`] = newCount;

        db.ref().update(updates).then(() => {
            if (!currentStatus) {
                const todayStr = '2026-11-01';
                const lastConfettiDate = localStorage.getItem('lastConfettiDate');
                const dailyGoal = parseInt(document.getElementById('dailyGoalInput').value) || 15;

                if (dateStr === todayStr && newCount >= dailyGoal && lastConfettiDate !== todayStr) {
                    triggerConfetti();
                    localStorage.setItem('lastConfettiDate', todayStr);
                }
            }
            closeCardModal();
        });
    }

    function saveGoals() {
        const daily = parseInt(document.getElementById('dailyGoalInput').value) || 15;
        const monthly = parseInt(document.getElementById('monthlyGoalInput').value) || 200;
        goalsData = { daily, monthly };
        goalsRef.set(goalsData);
        updateStats();
    }

    function submitData() {
        const y = document.getElementById('yearSelect').value;
        const m = String(document.getElementById('monthSelect').value).padStart(2, '0');
        const d = String(document.getElementById('daySelect').value).padStart(2, '0');
        const count = parseInt(document.getElementById('vocabCount').value);
        const mode = document.getElementById('modeSelect').value;

        if (!count || count <= 0) return alert('請輸入有效的單字數量。');

        const dateStr = `${y}-${m}-${d}`;
        let oldVal = vocabData[dateStr] || 0;
        let newCount = mode === 'add' ? oldVal + count : count;
        const dailyGoal = parseInt(document.getElementById('dailyGoalInput').value) || goalsData.daily || 15;

        vocabRef.child(dateStr).set(newCount).then(() => {
            document.getElementById('vocabCount').value = '';
            alert(`雲端同步成功！${dateStr} 總數：${newCount}`);

            const todayStr = '2026-11-01';
            const lastConfettiDate = localStorage.getItem('lastConfettiDate');
            if (dateStr === todayStr && newCount >= dailyGoal && lastConfettiDate !== todayStr) {
                triggerConfetti();
                localStorage.setItem('lastConfettiDate', todayStr);
            }
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth();

        document.getElementById('calendarTitle').innerText = `${y}年 ${m + 1}月`;

        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        weekDays.forEach(w => {
            grid.innerHTML += `<div class="calendar-day-header">${w}</div>`;
        });

        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();

        for(let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div></div>`;
        }

        for(let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const val = vocabData[dateStr];
            const hasDataClass = val ? 'has-data' : '';
            const badge = val ? `<div class="count-badge">+${val}</div>` : '';
            
            grid.innerHTML += `
                <div class="calendar-day ${hasDataClass}" onclick="jumpToDateLog('${dateStr}')">
                    <span>${d}</span>
                    ${badge}
                </div>
            `;
        }
    }

    function jumpToDateLog(dateStr) {
        const [y, m, d] = dateStr.split('-');
        document.getElementById('yearSelect').value = y;
        document.getElementById('monthSelect').value = parseInt(m);
        updateDays();
        document.getElementById('daySelect').value = parseInt(d);
        updateModalButtonState();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    function updateStats() {
        const todayStr = '2026-11-01';
        const todayVal = vocabData[todayStr] || 0;
        document.getElementById('statToday').innerText = todayVal;

        let yearSum = 0, monthSum = 0;
        const currentYear = 2026;
        const currentMonth = 10;

        Object.keys(vocabData).forEach(dateKey => {
            const [y, m, d] = dateKey.split('-').map(Number);
            const val = vocabData[dateKey];
            
            if (y === currentYear) {
                yearSum += val;
                if (m === (currentMonth + 1)) monthSum += val;
            }
        });

        document.getElementById('statWeek').innerText = todayVal;
        document.getElementById('statMonth').innerText = monthSum;
        document.getElementById('statYear').innerText = yearSum;

        const dailyGoal = parseInt(document.getElementById('dailyGoalInput').value) || goalsData.daily || 15;
        const monthlyGoal = parseInt(document.getElementById('monthlyGoalInput').value) || goalsData.monthly || 200;

        const dPct = (dailyGoal > 0 && todayVal > 0) ? Math.min(100, Math.round((todayVal / dailyGoal) * 100)) : 0;
        const mPct = (monthlyGoal > 0 && monthSum > 0) ? Math.min(100, Math.round((monthSum / monthlyGoal) * 100)) : 0;

        document.getElementById('dailyGoalText').innerText = `${todayVal} / ${dailyGoal} (${dPct}%)`;
        document.getElementById('dailyProgressBar').style.width = `${dPct}%`;

        document.getElementById('monthlyGoalText').innerText = `${monthSum} / ${monthlyGoal} (${mPct}%)`;
        document.getElementById('monthlyProgressBar').style.width = `${mPct}%`;
    }

    function triggerConfetti() {
        if (typeof confetti === 'function') {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
    }

    function switchChartRange(range) {
        currentChartRange = range;
        document.querySelectorAll('.card .level-btn').forEach(btn => {
            if(btn.getAttribute('onclick')?.includes('switchChartRange')) {
                btn.classList.remove('active');
            }
        });
        document.getElementById(`btn-${range}`).classList.add('active');
        updateChart();
    }

    function initChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: getChartData(),
            options: { 
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, grid: { borderDash: [4, 4] } },
                    x: { grid: { display: false } }
                },
                borderRadius: 4
            }
        });
    }

    function updateChart() {
        if(chartInstance) {
            chartInstance.data = getChartData();
            chartInstance.update();
        }
    }

    function getChartData() {
        const labels = [];
        const data = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(2026, 10, 1);
            d.setDate(d.getDate() - i);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const dateStr = `${y}-${m}-${day}`;
            labels.push(`${d.getMonth()+1}/${d.getDate()}`);
            data.push(vocabData[dateStr] || 0);
        }
        return {
            labels: labels,
            datasets: [{
                label: '單字量',
                data: data,
                backgroundColor: '#4f46e5',
                hoverBackgroundColor: '#4338ca'
            }]
        };
    }

    function handleSearchKey(e) {
        if (e.key === 'Enter') searchWord();
    }

    function searchWord() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) return alert('請輸入搜尋關鍵字。');

        const results = [];
        Object.keys(flashcardDatabase).forEach(level => {
            flashcardDatabase[level].forEach(item => {
                if (item.word.toLowerCase().includes(query) || item.definition.includes(query)) {
                    results.push({ level, item });
                }
            });
        });

        const area = document.getElementById('searchResultsArea');
        area.innerHTML = '';
        if (results.length === 0) {
            area.innerHTML = '<div style="color:var(--muted); text-align:center; padding:20px;">找不到符合的單字。</div>';
        } else {
            results.forEach(res => {
                area.innerHTML += `
                    <div style="padding:12px; border-bottom:1px solid var(--border); cursor:pointer;" onclick="openCardFromSearch(${JSON.stringify(res.item).replace(/"/g, '&quot;')})">
                        <strong>${res.item.word}</strong> (${res.item.pos}) - ${res.item.definition}
                        <div style="font-size:12px; color:var(--muted); margin-top:2px;">級距：Level ${res.level}</div>
                    </div>
                `;
            });
        }
        document.getElementById('searchModal').style.display = 'flex';
    }

    function openCardFromSearch(item) {
        closeSearchModal();
        openCardDetail(item);
    }

    function closeSearchModal() {
        document.getElementById('searchModal').style.display = 'none';
    }

    window.onload = init;
</script>
</body>
</html>
